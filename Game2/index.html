<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Side-Scroller v2 — Boss HP System</title>
<style>
  :root{--bg1:#9be7ff;--bg2:#7ec0ee;--ground:#8B5A2B;--sand:#d9b086}
  html,body{height:100%;margin:0;background:linear-gradient(var(--bg1),var(--bg2));font-family:system-ui, -apple-system, 'Hiragino Kaku Gothic ProN', 'Segoe UI', Roboto, sans-serif}
  #wrap{width:900px;margin:18px auto}
  #game{display:block;width:900px;height:540px;background:transparent;border:6px solid #333;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .meta{color:#222;margin-bottom:8px}
  .hint{font-size:13px;color:#333}
</style>
</head>
<body>
<div id="wrap">
  <div class="meta"><strong>Side-Scroller v2 — Boss HP version</strong> — 矢印左右：移動 / スペース：ジャンプ / R：リスタート</div>
  <canvas id="game" width="900" height="540"></canvas>
  <div class="hint">aaaaa</div>
</div>

<!-- main.js がモジュールをまとめて import する -->
<script type="module" src="./main.js"></script>
</body>
</html>
