<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>3ステージ マリオ型ゲーム</title>
<style>
  body { 
    margin:0; 
    background:#87CEEB; 
    font-family:sans-serif; 
    overflow:hidden; 
  }

  canvas { 
    display:block; 
    margin:0 auto; 
    background:#87CEEB; 
    touch-action:none; 
    width:100vw;
    height:auto;
    max-height:100vh;
  }

  /* HUD */
#hud {
  display: none;  /* 完全に消える */
}

  /* 操作ボタン */
  .btn {
    position:fixed; width:60px; height:60px;
    background:#fff8; border-radius:50%; font-size:24px; 
    text-align:center; line-height:60px; user-select:none;
    z-index:1000;
    touch-action: none;
  }

  #left { left:5%; bottom:10%; }
  #right { left:20%; bottom:10%; }
  #jump { right:5%; bottom:10%; }
  .btn:active { background:#fff4; }

  /* タイトル画面 */
  #titleScreen {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:#0008; display:flex; align-items:center; justify-content:center;
    z-index:2000; color:#fff; font-size:2em; flex-direction:column;
  }
  #startButton {
    margin-top:20px; padding:10px 30px; font-size:1em; cursor:pointer;
  }
</style>
</head>
<body>

<!-- タイトル画面 -->
<div id="titleScreen">
  <div>3ステージ マリオ型ゲーム</div>
  <button id="startButton">スタート</button>
</div>

<canvas id="game" width="960" height="540"></canvas>

<!-- ★ これが足りていなかった！  -->
<div id="hud"></div>

<!-- 移動ボタン -->
<div id="left" class="btn">◀</div>
<div id="right" class="btn">▶</div>
<div id="jump" class="btn">▲</div>

<script type="module" src="js/main.js"></script>

</body>
</html>
