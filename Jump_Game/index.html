<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>

<title>3ステージ マリオ型ゲーム</title>

<style>

:root{
  --controller-height:180px;
}

body{
  margin:0;
  background:#87CEEB;
  font-family:sans-serif;
  overflow:hidden;
}

/* ===============================
   ゲーム画面
================================ */

canvas{
  display:block;
  margin:0 auto;
  width:90vw;
  height:auto;
  max-height:calc(100vh - var(--controller-height));
}

#hud{
  display:none;
}

/* ===============================
   コントローラー
================================ */

#controller{
  position:fixed;
  left:0;
  bottom:0;
  width:100vw;
  height:var(--controller-height);

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:0 24px;
  box-sizing:border-box;

  z-index:2000;
}

#moveButtons{
  display:flex;
  gap:20px;
}

#jump{
  margin-left:-20px;
}

/* ===============================
   操作ボタン
================================ */

.btn{
  width:80px;
  height:80px;

  background:#fff8;
  border-radius:50%;

  font-size:48px;
  text-align:center;
  line-height:60px;

  user-select:none;
  touch-action:none;
}

.btn:active{
  background:#fff4;
}

/* ===============================
   タイトル画面
================================ */

#titleScreen{
  position:fixed;
  top:0;
  left:0;

  width:100%;
  height:100%;

  background:#0008;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  z-index:3000;

  color:#fff;
  text-align:center;
}

/* タイトル画像 */

.title-container{
  position:relative;
  display:inline-block;
}

.title-image{
  width:50vw;
  display:block;
  margin:20px auto;
}

/* スタートボタン */

#startButton{

  position:absolute;
  left:50%;
  top:70%;
  transform:translate(-50%,-50%);

  background:linear-gradient(to bottom,#ffa733,#ff7b00);
  color:white;

  font-size:18px;
  padding:10px 24px;

  border:none;
  border-radius:12px;

  cursor:pointer;
  font-weight:bold;

  box-shadow:0 5px 0 #cc6200;
}

#startButton:active{
  transform:translate(-50%,-45%);
  box-shadow:0 0 0 #cc6200;
}

/* ===============================
   説明スクロール
================================ */

.instructions{

  width:80%;
  max-width:500px;

  max-height:150px;

  overflow-y:auto;

  margin-top:20px;

  font-size:22px;
  line-height:1.6;

  -webkit-overflow-scrolling:touch;
}

/* ===============================
   横向き対応
================================ */

@media (orientation: landscape){

  :root{
    --controller-height:100px;
  }

  .btn{
    width:80px;
    height:80px;
    font-size:40px;
    line-height:56px;
  }

}

</style>
</head>

<body>

<div id="titleScreen">

  <div class="title-container">

    <img src="./images/graphics/title.png"
         class="title-image">

    <button id="startButton">スタート</button>

  </div>

  <div class="instructions">

    <div>
      ▲‥‥ジャンプ。ジャンプ中に押したら二段ジャンプできます
    </div>

    <div>
      ●‥‥瞬間移動。再上空まで一瞬で飛べますが、ＨＰを１消耗します。あと、一回使ったら５秒間使えません
    </div>

    <div>
      スマホ横向き推奨
    </div>

  </div>

</div>

<canvas id="game" width="960" height="540"></canvas>

<div id="hud"></div>

<div id="controller">

  <div id="moveButtons">
    <div id="left" class="btn">◀</div>
    <div id="right" class="btn">▶</div>
  </div>

  <div style="display:flex; gap:80px;">
    <div id="b" class="btn">●</div>
    <div id="jump" class="btn">▲</div>
  </div>

</div>

<script type="module" src="js/main.js"></script>

</body>
</html>
