<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>3ステージ マリオ型ゲーム</title>

<style>
:root {
  --controller-height: 180px;
}

body { 
  margin:0; 
  background:#87CEEB; 
  font-family:sans-serif; 
  overflow:hidden; 
}

canvas {
  display: block;
  margin: 0 auto;          /* 横中央 */
  width: 95vw;             /* 横幅90% */
  height: auto;            /* アスペクト比維持 */
  max-height: calc(100vh - var(--controller-height)); /* コントローラーとの干渉回避 */
  transform: none;         /* 拡大縮小はCSSで対応 */
}

#hud {
  display: none;
}

/* ===============================
   コントローラー
================================ */
#controller {
  position: fixed;
  left: 0;
  bottom: 0;

  width: 100vw;
  height: var(--controller-height);
  background: none;

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 0 24px;
  box-sizing: border-box;
  z-index: 2000;
}

/* 横並びのボタンコンテナ */
#moveButtons {
  display: flex;
  flex-direction: row;
  gap: 20px; /* デフォルトのボタン間隔（ジャンプボタンとの間） */
  align-items: center;
}

/* 左右移動ボタンの間隔だけなくす */
#left, #right {
  margin: 0;  /* 個別の余白をリセット */
}

/* 左右ボタンをくっつける */
#left {
  margin-right: 0; /* 右側の余白を削除 */
}

#right {
  margin-left: 0;  /* 左側の余白を削除 */
}



/* ジャンプボタン */
#jump {
  margin-left: -20px;
}

/* ===============================
   ボタン
================================ */
.btn {
  width: 60px;
  height: 60px;
  background:#fff8;
  border-radius:50%;
  font-size:48px;
  text-align:center;
  line-height:60px;
  user-select:none;
  touch-action: none;
}

.btn:active {
  background:#fff4;
}

/* ===============================
   タイトル
================================ */
#titleScreen {
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background:#0008;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  z-index:3000;
  color:#fff;
  font-size:2em;
}

#startButton {
  margin-top:20px;
  padding:10px 30px;
  font-size:1em;
  cursor:pointer;
}

/* 横向き対応 */
@media (orientation: landscape) {
  :root {
    --controller-height: 100px;
  }

  .btn {
    width: 80px;
    height:80px;
    line-height: 56px;
    font-size: 40px;
  }
}
</style>
</head>

<body>

<div id="titleScreen">
  <div>3ステージ マリオ型ゲーム(スマホ横向き推奨)</div>
  <button id="startButton">スタート</button>
</div>

<canvas id="game" width="960" height="540"></canvas>
<div id="hud"></div>

<!-- 正しい構造 -->
<div id="controller">
  <div id="moveButtons">
        <div id="left" class="btn">◀</div>
    <div id="right" class="btn">▶</div>

  </div>
  <div id="jump" class="btn">▲</div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
