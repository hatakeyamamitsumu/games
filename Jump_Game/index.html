<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>3ステージ マリオ型ゲーム</title>

<style>
  body { 
    margin:0; 
    background:#87CEEB; 
    font-family:sans-serif; 
    overflow:hidden; 
  }

  /* ゲーム画面 */
  canvas { 
    display:block; 
    margin:0 auto; 
    background:#87CEEB; 
    touch-action:none; 
    width:100vw;
    height:auto;
    max-height: calc(100vh - 180px); /* ← ボタン分の高さを確保 */
  }

  /* HUD */
  #hud {
    display: none;
  }

  /* === 操作ボタン全体 === */
  #controller {
    width: 100vw;
    height: 180px;
    background: #0002;
    position: fixed;
    bottom: 80;
    left: 0;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 2000;
  }

  /* ボタンデザイン */
  .btn {
    width: 90px;
    height: 90px;
    background:#fff8;
    border-radius:50%;
    font-size:36px;
    text-align:center;
    line-height:90px;
    user-select:none;
    touch-action: none;
  }

  .btn:active { background:#fff4; }

  /* タイトル画面 */
  #titleScreen {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:#0008; display:flex; align-items:center; justify-content:center;
    z-index:3000; color:#fff; font-size:2em; flex-direction:column;
  }
  #startButton {
    margin-top:20px; padding:10px 30px; font-size:1em; cursor:pointer;
  }
</style>
</head>

<body>

<!-- タイトル画面 -->
<div id="titleScreen">
  <div>3ステージ マリオ型ゲーム</div>
  <button id="startButton">スタート</button>
</div>

<!-- ゲーム画面 -->
<canvas id="game" width="960" height="540"></canvas>

<!-- HUD（使わないので非表示） -->
<div id="hud"></div>

<!-- 操作ボタン（横並び） -->
<div id="controller">
  <div id="left" class="btn">◀</div>
  <div id="right" class="btn">▶</div>
  <div id="jump" class="btn">▲</div>
</div>

<script type="module" src="js/main.js"></script>

</body>
</html>
