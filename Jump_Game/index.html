<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>3ステージ マリオ型ゲーム</title>

<style>

/* ===============================
基本設定
================================ */

:root{
  --controller-height:180px;
}

body{
  margin:0;
  background:#87CEEB;
  font-family:sans-serif;
  overflow:hidden;
}

/* ===============================
ゲーム画面
================================ */

canvas{
  display:block;
  margin:0 auto;
  width:90vw;
  height:auto;
  max-height:calc(100vh - var(--controller-height));
}

#hud{
  display:none;
}

/* ===============================
コントローラー
================================ */

#controller{

  position:fixed;
  left:0;
  bottom:30px;

  width:100vw;
  height:var(--controller-height);

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:0 24px;
  box-sizing:border-box;

  z-index:2000;
}

#moveButtons{
  display:flex;
  gap:20px;
}

/* ===============================
操作ボタン
================================ */

.btn{

  width:80px;
  height:80px;

  background:#ffffff88;
  border-radius:50%;

  font-size:42px;
  text-align:center;
  line-height:80px;

  user-select:none;
  -webkit-user-select:none;

  touch-action:none;
}

.btn:active{
  background:#ffffff44;
}

/* ===============================
タイトル画面
================================ */

#titleScreen{

  position:fixed;
  inset:0;

  background:#00000088;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  z-index:3000;

  color:#fff;
  text-align:center;
}

/* タイトル画像 + ボタン */

.title-container{
  position:relative;
  width:60vw;
  max-width:420px;
}

.title-image{
  width:100%;
  display:block;
}

/* スタートボタン */

#startButton{

  position:absolute;
  left:50%;
  bottom:15%;

  transform:translateX(-50%);

  background:linear-gradient(#ffa733,#ff7b00);
  color:white;

  font-size:18px;
  padding:10px 26px;

  border:none;
  border-radius:12px;

  font-weight:bold;

  cursor:pointer;

  box-shadow:0 5px 0 #cc6200;
}

#startButton:active{
  transform:translate(-50%,4px);
  box-shadow:0 0 0 #cc6200;
}

/* ===============================
説明スクロール
================================ */

.instructions{

  width:82%;
  max-width:520px;

  height:200px;

  overflow-y:auto;

  margin-top:25px;

  font-size:20px;
  line-height:1.6;

  padding:14px;

  background:#00000055;
  border-radius:10px;

  -webkit-overflow-scrolling:touch;

  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;

  touch-action:pan-y;
}

/* スクロールバー */

.instructions::-webkit-scrollbar{
  width:25px;
}

.instructions::-webkit-scrollbar-thumb{
  background:#ffffffaa;
  border-radius:8px;
}

.instructions::-webkit-scrollbar-track{
  background:#00000033;
}

/* ===============================
横向き対応
================================ */

@media (orientation:landscape){

:root{
  --controller-height:100px;
}

.btn{
  width:70px;
  height:70px;
  line-height:70px;
  font-size:36px;
}

.instructions{
  height:150px;
}

}

</style>
</head>

<body>

<!-- タイトル画面 -->

<div id="titleScreen">

<div class="title-container">

<img src="./images/graphics/title.png" class="title-image">

<button id="startButton">
スタート
</button>

</div>

<div class="instructions">

<div>
▲ ジャンプ  
ジャンプ中に押すと二段ジャンプできます
</div>

<br>

<div>
● 瞬間移動  
再上空まで一瞬で飛びます  
HPを1消費します  
使用後5秒クールタイム
</div>

<br>

<div>
スマホ横向き推奨
</div>

</div>

</div>

<!-- ゲーム画面 -->

<canvas id="game" width="960" height="540"></canvas>

<div id="hud"></div>

<!-- コントローラー -->

<div id="controller">

<div id="moveButtons">
<div id="left" class="btn">◀</div>
<div id="right" class="btn">▶</div>
</div>

<div style="display:flex;flex-direction:row;gap:25px;">
  <div id="b" class="btn">●</div>
  <div id="jump" class="btn">▲</div>
</div>

</div>

</div>

<script type="module" src="js/main.js"></script>

</body>
</html>
