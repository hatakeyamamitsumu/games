<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>3ステージ マリオ型ゲーム</title>

<style>
/* ===============================
   CSS 変数
================================ */
:root {
  --controller-height: 180px;
}

/* ===============================
   基本レイアウト
================================ */
body { 
  margin:0; 
  background:#87CEEB; 
  font-family:sans-serif; 
  overflow:hidden; 
}

/* ===============================
   ゲーム画面（canvas）
================================ */
canvas {
  display: block;
  margin: 0 auto;
  background: #87CEEB;

  height: calc(100vh - var(--controller-height));
  width: auto;

  aspect-ratio: 16 / 9;
}


/* ===============================
   HUD（未使用）
================================ */
#hud {
  display: none;
}

/* ===============================
   操作ボタン全体
================================ */
#controller {
  position: fixed;
  left: 0;
  bottom: 0;
  width: 100vw;
  height: var(--controller-height);
  background: #0002;

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 0 24px;
  box-sizing: border-box;
  z-index: 2000;
}

/* 左右移動グループ */
#moveButtons {
  display: flex;
  gap: 12px;
}

/* ジャンプボタン（少し左寄せ） */
#jump {
  margin-left: -30px;
}

/* ===============================
   ボタンデザイン
================================ */
.btn {
  width: 60px;
  height: 60px;
  background:#fff8;
  border-radius:50%;
  font-size:36px;
  text-align:center;
  line-height:60px;
  user-select:none;
  touch-action: none;
}

.btn:active {
  background:#fff4;
}

/* ===============================
   タイトル画面
================================ */
#titleScreen {
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background:#0008;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  z-index:3000;
  color:#fff;
  font-size:2em;
}

#startButton {
  margin-top:20px;
  padding:10px 30px;
  font-size:1em;
  cursor:pointer;
}

/* ===============================
   スマホ横向き対応
================================ */
@media (orientation: landscape) {
  :root {
    --controller-height: 100px; /* 120 → 100 */
  }

  .btn {
    width: 56px;    /* 64 → 56 */
    height: 56px;
    line-height: 56px;
    font-size: 24px;
  }



  #jump {
    margin-left: -20px;
  }
}
</style>
</head>

<body>

<!-- タイトル画面 -->
<div id="titleScreen">
  <div>3ステージ マリオ型ゲーム(スマホ横向き推奨)</div>
  <button id="startButton">スタート</button>
</div>

<!-- ゲーム画面 -->
<canvas id="game" width="960" height="540"></canvas>

<!-- HUD -->
<div id="hud"></div>

<!-- 操作ボタン -->
<div id="controller">
  <div id="moveButtons">
    <div id="left" class="btn">◀</div>
    <div id="right" class="btn">▶</div>
  </div>
  <div id="jump" class="btn">▲</div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
