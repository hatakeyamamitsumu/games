<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>

<title>3ステージ マリオ型ゲーム</title>

<style>
/* ===============================
   CSS 変数
================================ */
:root {
  --controller-height: 150px;
  --max-game-width: 420px;
}

/* ===============================
   基本レイアウト
================================ */
body {
  margin:0;
  background:#87CEEB;
  font-family:sans-serif;
  overflow:hidden;
  touch-action: manipulation; /* ★ ダブルタップズーム防止 */
}

/* ===============================
   ゲーム画面（canvas）
================================ */
canvas {
  display:block;
  margin:0 auto;
  background:#87CEEB;

  width:100%;
  max-width:var(--max-game-width);
  max-height:calc(100vh - var(--controller-height));
  aspect-ratio:16 / 9;

  image-rendering:pixelated;
  touch-action:none;
}

/* ===============================
   操作ボタン全体
================================ */
#controller {
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);

  width:100%;
  max-width:var(--max-game-width);
  height:var(--controller-height);

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:0 16px;
  box-sizing:border-box;
  background:#0002;
  z-index:2000;
}

/* 左右移動 */
#moveButtons {
  display:flex;
  gap:12px;
}

/* ===============================
   ボタンデザイン
================================ */
.btn {
  width:56px;
  height:56px;
  background:#fff8;
  border-radius:50%;
  font-size:28px;
  text-align:center;
  line-height:56px;
  user-select:none;
  touch-action:manipulation;
}

.btn:active {
  background:#fff4;
}

/* ジャンプボタン */
#jump {
  width:64px;
  height:64px;
  line-height:64px;
  font-size:32px;
}

/* ===============================
   タイトル画面
================================ */
#titleScreen {
  position:fixed;
  inset:0;
  background:#0008;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:3000;
  color:#fff;
  font-size:1.8em;
}

#startButton {
  margin-top:20px;
  padding:12px 36px;
  font-size:1rem;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* ===============================
   横向きスマホ対応
================================ */
@media (orientation: landscape) {
  :root {
    --controller-height: 100px;
  }

  .btn {
    width:48px;
    height:48px;
    line-height:48px;
    font-size:22px;
  }

  #jump {
    width:56px;
    height:56px;
    line-height:56px;
    font-size:26px;
  }
}
</style>
</head>

<body>

<!-- タイトル画面 -->
<div id="titleScreen">
  <div>3ステージ マリオ型ゲーム</div>
  <button id="startButton">スタート</button>
</div>

<!-- ゲーム画面 -->
<canvas id="game" width="960" height="540"></canvas>

<!-- 操作ボタン -->
<div id="controller">
  <div id="moveButtons">
    <div id="left" class="btn">◀</div>
    <div id="right" class="btn">▶</div>
  </div>
  <div id="jump" class="btn">▲</div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
