<canvas id="game" width="960" height="540"></canvas>
<div id="hud"></div>

<!-- 左右ボタン -->
<div id="left-right-buttons">
  <button id="left">◀</button>
  <button id="right">▶</button>
</div>

<!-- ジャンプボタン -->
<div id="jump-button">
  <button id="jump">▲</button>
</div>

<!-- ★ ES Modules として main.js だけを読み込む -->
<script type="module" src="js/main.js"></script>

<style>
/* 左右ボタン */
#left-right-buttons {
  position: fixed;
  bottom: 20px;
  left: 20px;
  display: flex;
  gap: 10px;
  z-index: 1000;
}

#left-right-buttons button,
#jump-button button {
  width: 60px;
  height: 60px;
  font-size: 24px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.5);
  color: white;
  touch-action: none; /* ダブルタップズーム防止 */
}

/* ジャンプボタン */
#jump-button {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 1000;
}
</style>
