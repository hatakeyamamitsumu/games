<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ジャンプゲーム — 完全版（主人公画像版・着地修正・zigzag画像）</title>
<style>
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,"Hiragino Kaku Gothic ProN",sans-serif; background:#f8f8f8; display:flex; flex-direction:column; align-items:center; }
  h2 { margin:12px 0; }
  #canvasWrap { margin:0 auto; }
  canvas { border:1px solid #222; background:lightblue; image-rendering:pixelated; display:block; }
  #buttonArea { margin:12px 0; display:flex; gap:12px; width:420px; justify-content:center; }
  button { font-size:20px; padding:14px 22px; border-radius:10px; border:none; background:orange; color:white; cursor:pointer; }
  button:active { background:darkorange; }
  #rules { max-width:720px; text-align:left; padding:10px; font-size:14px; color:#222; }
  #msg { position:fixed; top:6px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.6); color:white; padding:6px 12px; border-radius:8px; font-size:13px; display:none; z-index:999; }
</style>
</head>
<body>
<h2>ジャンプゲーム 🎈（主人公画像版・着地修正・zigzag画像）</h2>
<div id="canvasWrap"><canvas id="game" width="400" height="300"></canvas></div>

<div id="buttonArea">
  <button id="restartBtn">リスタート</button>
  <button id="jumpBtn">ジャンプ（Space）</button>
</div>

<div id="rules">
  <h3>ルール</h3>
  <ul>
    <li>スペースキーかジャンプボタンでジャンプ</li>
    <li>穴に落ちるとゲームオーバー</li>
    <li>赤いハートは回復アイテム</li>
    <li>ピンクの風船はスコア＋時間</li>
    <li>オレンジ敵は踏むとスコアアップ（逆三角）</li>
    <li>緑・青はトゲ（いがぐり）</li>
    <li>距離＋スコアを満たすとゴールラインが出現。触れればクリア（花火）</li>
  </ul>
</div>

<div id="msg"></div>

<script>
/* =========================
   BGM プレーヤー（独立）
   ========================= */
class BGMPlayer {
  constructor(src, opts={volume:0.7, loop:true}) {
    this.src = src;
    this.audio = new Audio(src);
    this.audio.loop = !!opts.loop;
    this.audio.volume = typeof opts.volume === 'number' ? opts.volume : 1.0;
    this._isPlaying = false;
  }
  play() { return this.audio.play().then(()=>{ this._isPlaying=true; }).catch(e=>{ this._isPlaying=false; throw e; }); }
  pause(){ this.audio.pause(); this._isPlaying=false; }
  stop(){ this.pause(); this.audio.currentTime = 0; }
  fadeOut(step=0.02, interval=100){
    const audio = this.audio;
    const fade = setInterval(()=>{
      if(audio.volume > step){ audio.volume = Math.max(0, audio.volume - step); }
      else { audio.volume = 0; audio.pause(); clearInterval(fade); }
    }, interval);
  }
  setVolume(v){ this.audio.volume = Math.max(0, Math.min(1, v)); }
  isPlaying(){ return this._isPlaying && !this.audio.paused; }
}

/* =========================
   グローバル設定（地面座標など）
   ========================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;

// 地面の Y 座標を定数にする（ここを変えれば全て連動）
const GROUND_Y = 270;
// 障害物が地面付近（穴に落ちる直前）か判定するしきい値（以前の230相当）
const OB_FALL_THRESHOLD = GROUND_Y - 40;

const worldSpeedDefault = 2;
let worldSpeed = worldSpeedDefault;
const goalDistance = 1200;
const goalScore = 30;

/* =========================
   ゲーム本体 変数宣言
   ========================= */
let player, jumpStage, maxJumpStage, obstacles, explosions, holes;
let fireworks; // 花火パーティクル
let score, gameOver, spawnTimer, holeTimer, gameTime, hp, invincible, flash;
let distance = 0;
let goalLine = null;
let gameClear = false;
let loopStarted = false;

/* プレイヤー画像（同じサイズ：player.size で描画） */
const playerImage = new Image();
playerImage.src = "characters/hero/hero.png"; // 相対パスで配置してください

const normalImage = new Image();
normalImage.src = "characters/normal/normal.png"; // ←ファイル名を確認してください


/* zigzag 敵の画像（相対パス） */
const zigzagImage = new Image();
zigzagImage.src = "characters/zigzag/zigzag.png"; // ← ここに画像を置いてください（相対パス）

const balloonImage = new Image();
balloonImage.src = "characters/baloon/baloon.png";

const breakableImage = new Image();
breakableImage.src = "characters/breakable/breakable.png";

const healImage = new Image();
healImage.src = "characters/heal/heal.png";
/* BGM / SE パス（必要なファイルを配置） */
const bgmPlayer = new BGMPlayer("sounds/BGM/a.mp3", {volume:0.05, loop:true});
const fireworkSEPath = "sounds/Sound_Effect/firework.mp3";

/* メッセージ表示ユーティリティ */
const msgBox = document.getElementById('msg');
function showMsg(text, ms=1800){
  msgBox.textContent = text;
  msgBox.style.display = 'block';
  clearTimeout(showMsg._t);
  showMsg._t = setTimeout(()=> msgBox.style.display = 'none', ms);
}

/* ---------- 初期化 ---------- */
function resetGameState(){
  // player.size を変えても、y は地面と一致するように GROUND_Y - size を使う
  const initialSize = 30; // ここを変更すればキャラの描画サイズを変えられます
  player = { x:50, y: GROUND_Y - initialSize, vy:0, size: initialSize, falling:false };
  jumpStage = 0; maxJumpStage = 2;
  obstacles = []; explosions = []; holes = [];
  fireworks = [];
  score = 0; spawnTimer = 0; holeTimer = 0;
  gameTime = 6000; // ticks
  hp = 3; invincible = 0; flash = 0;
  distance = 0; goalLine = null; gameClear = false; gameOver = false;
  worldSpeed = worldSpeedDefault;

  // reset environment positions
  mountains[0].x = 0; mountains[1].x = W;
  clouds[0].x = 80; clouds[1].x = 220; clouds[2].x = 340;
}

/* =========================
   花火（パーティクル）
   ========================= */
function spawnFireworks(cx, cy, bursts = 10){
  const colors = ["#ff5050","#ffb84d","#fff06a","#7efc8d","#8ad4ff","#d6a0ff","#ffffff","#ff69b4"];
  for(let b=0;b<bursts;b++){
    const particles = 36 + Math.floor(Math.random()*32);
    for(let i=0;i<particles;i++){
      const angle = Math.random()*Math.PI*2;
      const speed = 2 + Math.random()*6;
      const vx = Math.cos(angle) * speed * (0.6 + Math.random()*0.8);
      const vy = Math.sin(angle) * speed * (0.6 + Math.random()*0.8);
      const life = 60 + Math.floor(Math.random()*80);
      const size = 1 + Math.random()*4;
      const color = colors[Math.floor(Math.random()*colors.length)];
      fireworks.push({ x: cx + (Math.random()-0.5)*30, y: cy + (Math.random()-0.5)*30, vx, vy, size, color, life, age:0, alpha:1 });
    }
  }
}
function updateFireworks(){
  for(let p of fireworks){
    p.age++;
    p.vy += 0.04;
    p.vx *= 0.995;
    p.vy *= 0.998;
    p.x += p.vx;
    p.y += p.vy;
    p.alpha = Math.max(0, 1 - p.age / p.life);
  }
  fireworks = fireworks.filter(p => p.age < p.life);
}
function drawFireworks(){
  for(let p of fireworks){
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* =========================
   雲 / 山
   ========================= */
const clouds = [ {x:80,y:50,scale:1,speed:0.2}, {x:220,y:70,scale:0.8,speed:0.15}, {x:340,y:40,scale:1.2,speed:0.25} ];
function drawCloud(c){
  ctx.fillStyle="rgba(255,255,255,0.9)";
  ctx.beginPath();
  ctx.arc(c.x, c.y, 20*c.scale,0,Math.PI*2);
  ctx.arc(c.x+15*c.scale, c.y-10*c.scale,15*c.scale,0,Math.PI*2);
  ctx.arc(c.x+30*c.scale, c.y,20*c.scale,0,Math.PI*2);
  ctx.closePath(); ctx.fill();
}
const mountains = [{x:0,color:"#9ACD9A"},{x:W,color:"#9ACD9A"}];
function drawMountains(){
  mountains.forEach(m=>{
    ctx.fillStyle = m.color;
    ctx.beginPath();
    ctx.moveTo(m.x, 200);
    ctx.lineTo(m.x + 80, 140);
    ctx.lineTo(m.x + 160, 180);
    ctx.lineTo(m.x + 240, 150);
    ctx.lineTo(m.x + 320, 170);
    ctx.lineTo(m.x + 400, 200);
    ctx.lineTo(m.x + 400, 270);
    ctx.lineTo(m.x, 270);
    ctx.closePath();
    ctx.fill();
  });
}

/* =========================
   入力（ジャンプ）
   ========================= */
function doJump(){
  if(gameOver || gameClear) return;
  tryPlayBGMOnce();
  if(!player.falling && jumpStage < maxJumpStage){
    jumpStage++;
    // 1段目を少し高くする例（必要なら変更）
    player.vy = jumpStage===1 ? -10 : -12;
    playJumpSound();
  }
}
document.addEventListener("keydown", e=>{
  if(e.code==="Space"){ e.preventDefault(); doJump(); }
  if(e.code==="Enter" && (gameOver || gameClear)) restart();
});
document.getElementById("jumpBtn").addEventListener("click", doJump);
document.getElementById("restartBtn").addEventListener("click", ()=>{
  tryPlayBGMOnce(true);
  restart();
});
canvas.addEventListener("touchstart", e=>{ e.preventDefault(); doJump(); }, {passive:false});

/* =========================
   シンセ系 SE（WebAudio）
   ========================= */
function playSoundSequence(seq){
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  seq.forEach(({freq,type="sine",duration=0.2,delay=0,volume=0.2})=>{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    const startTime = audioCtx.currentTime + delay;
    gain.gain.setValueAtTime(volume,startTime);
    gain.gain.exponentialRampToValueAtTime(0.001,startTime+duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(startTime); osc.stop(startTime+duration+0.05);
  });
}
function playJumpSound(){ playSoundSequence([{freq:jumpStage===1?440:550,type:"triangle",duration:0.12}]); }
function playDamageSound(){ playSoundSequence([{freq:160,type:"square",duration:0.22},{freq:80,type:"square",duration:0.22,delay:0.08}]); }
function playFallSound(){ playSoundSequence([{freq:120,type:"sine",duration:1.2}]); }
function playHealSound(){ playSoundSequence([{freq:523,type:"sine",duration:0.25},{freq:784,type:"sine",duration:0.25,delay:0.18}]); }
function playEnemyDefeatSound(){ playSoundSequence([{freq:420,type:"triangle",duration:0.12},{freq:560,type:"triangle",duration:0.12,delay:0.08}]); }
function playGoalSound(){ playSoundSequence([{freq:880,type:"sine",duration:0.25},{freq:660,type:"sine",duration:0.25,delay:0.2}]); }
function playClearSound(){ playSoundSequence([{freq:1200,type:"sine",duration:0.25},{freq:900,type:"sine",duration:0.2,delay:0.18},{freq:700,type:"sine",duration:0.18,delay:0.34}]); }

/* =========================
   障害物・穴
   ========================= */
function spawnObstacle(){
  const count = Math.floor(Math.random()*3)+1;
  for(let i=0;i<count;i++){
    let type;
    if(Math.random()<0.08) type="heal";
    else type = ["normal","zigzag","breakable","balloon"][Math.floor(Math.random()*4)];

    let yPos, baseY;
    let width = 20, height = 20;
    if(type==="heal"){ yPos = 30 + Math.random()*50; width = 26; height = 26; }
    else if(type==="balloon"){ yPos = 50 + Math.random()*100; width = 26; height = 26; }
    else if(type==="zigzag"){ baseY = 140 + Math.random()*60; yPos = baseY; width = 26; height = 26; } // zigzag は少し大きめ
    else yPos = (Math.random()<0.5) ? GROUND_Y - 20 : 100 + Math.random()*100;

    obstacles.push({x:W + i*30, y:yPos, width:width, height:height, type:type, angle:0, vy:0, falling:false, baseY:baseY, scored:false});
  }
}
function spawnHoleIfReady(){
  holeTimer++;
  if(holeTimer>=120){
    if(Math.random()<0.5) holes.push({x:W, width:40});
    holeTimer = 0;
  }
}
function updateObstacles(){
  for(let ob of obstacles){
    if(ob.falling){
      ob.vy += 0.6;
      ob.y += ob.vy;
    } else {
      const speed = (ob.type==="balloon" || ob.type==="heal") ? worldSpeed * 0.6 : worldSpeed;
      ob.x -= speed;
      if(ob.type==="zigzag" && ob.baseY!==undefined){
        ob.y = ob.baseY + Math.sin(ob.angle) * 30;
        ob.angle += 0.12;
      }
      if(ob.type==="balloon" || ob.type==="heal"){
        ob.y += Math.sin(ob.angle) * 0.6;
        ob.x += Math.sin(ob.angle/2) * 0.4;
        ob.angle += 0.06;
      }
      if(!ob.falling && (ob.type==="normal"||ob.type==="breakable")){
        for(let h of holes){
          if(ob.x+ob.width > h.x && ob.x < h.x + h.width && ob.y >= OB_FALL_THRESHOLD){
            ob.falling = true; ob.vy = 2; break;
          }
        }
      }
    }
  }

  obstacles = obstacles.filter(ob=>{
    if(!ob.falling && ob.x < -ob.width){
      if(!ob.scored){ score++; ob.scored = true; }
      return false;
    }
    if(ob.falling && ob.y > canvas.height + 50) return false;
    return true;
  });

  holes.forEach(h => h.x -= worldSpeed);
  holes = holes.filter(h => h.x + h.width > 0);
}

/* =========================
   衝突判定
   ========================= */
function checkCollision(){
  if(invincible>0 || player.falling || gameClear) return;

  for(let i=0;i<obstacles.length;i++){
    const ob = obstacles[i];
    if(ob.falling) continue;

    // 円同士（回復・風船）
    const dx = (player.x + player.size/2) - (ob.x + ob.width/2);
    const dy = (player.y + player.size/2) - (ob.y + ob.height/2);
    const dist = Math.sqrt(dx*dx + dy*dy);

    if(ob.type === "heal" && dist < player.size/2 + 14){
      explosions.push({x:ob.x + ob.width/2, y:ob.y + ob.height/2, radius:0, maxRadius:60, color:"rgba(255,50,50,0.6)"});
      obstacles.splice(i,1); i--;
      hp = 3; score += 10; flash = 8; invincible = 30; playHealSound(); continue;
    }

    if(ob.type === "balloon" && dist < player.size/2 + 16){
      explosions.push({x:ob.x + ob.width/2, y:ob.y + ob.height/2, radius:0, maxRadius:30});
      obstacles.splice(i,1); i--;
      score += 5; gameTime += 60;
      player.vy = (player.y + player.size/2 < ob.y + ob.height/2) ? -10 : 5;
      invincible = 30; flash = 10; playEnemyDefeatSound(); continue;
    }

    // 四角判定（敵）
    if(["normal","zigzag","breakable"].includes(ob.type) &&
       player.x < ob.x + ob.width && player.x + player.size > ob.x &&
       player.y < ob.y + ob.height && player.y + player.size > ob.y){
      if(ob.type === "breakable" && player.vy > 0 && player.y + player.size <= ob.y + 10){
        explosions.push({x:ob.x + ob.width/2, y:ob.y + ob.height/2, radius:0, maxRadius:30});
        obstacles.splice(i,1); i--;
        score += 5; gameTime += 60; player.vy = -8; playEnemyDefeatSound(); continue;
      }
      hp--; invincible = 30; flash = 10; playDamageSound();
      if(hp <= 0) return endGame();
    }
  }

  // 穴判定（player の足 = player.y + player.size と GROUND_Y を比較）
  const footY = player.y + player.size;
  const footXCenter = player.x + player.size/2;
  for(let h of holes){
    if(!player.falling && footY >= GROUND_Y && footXCenter > h.x + 4 && footXCenter < h.x + h.width - 4){
      player.falling = true; player.vy = 2; playFallSound(); break;
    }
  }
}

/* =========================
   爆発更新
   ========================= */
function updateExplosions(){ for(let e of explosions) e.radius += 2; explosions = explosions.filter(e => e.radius < e.maxRadius); }

/* =========================
   描画
   ========================= */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // 背景グラデ
  const bgGrad = ctx.createLinearGradient(0,0,0,canvas.height);
  bgGrad.addColorStop(0,"#3b75a8"); bgGrad.addColorStop(0.4,"#87CEEB"); bgGrad.addColorStop(1,"#f0f0f0");
  ctx.fillStyle = bgGrad; ctx.fillRect(0,0,canvas.width,canvas.height);

  // 山
  drawMountains();

  // 雲
  clouds.forEach(c => drawCloud(c));

  // 地面（GROUND_Y を使用）
  const groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, canvas.height);
  groundGrad.addColorStop(0,"#6b3f1a"); groundGrad.addColorStop(1,"#A0522D");
  ctx.fillStyle = groundGrad; ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

  // 地面の凹凸
  ctx.strokeStyle = "rgba(0,0,0,0.12)";
  for(let i=0;i<canvas.width;i+=6){
    const offset = Math.sin(i * 0.18 + distance * 0.02) * 2;
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(i, GROUND_Y + offset); ctx.lineTo(i, canvas.height); ctx.stroke();
  }

// 障害物（画像対応）
obstacles.forEach(ob => {
    if(ob.type === "balloon") {
        if(balloonImage.complete && balloonImage.naturalWidth !== 0){
            ctx.drawImage(balloonImage, ob.x, ob.y, ob.width, ob.height);
        } else {
            ctx.beginPath();
            ctx.arc(ob.x+ob.width/2, ob.y+ob.height/2, 12, 0, Math.PI*2);
            ctx.fillStyle="pink"; ctx.fill();
            ctx.beginPath();
            ctx.moveTo(ob.x+ob.width/2, ob.y+ob.height/2+12);
            ctx.lineTo(ob.x+ob.width/2, ob.y+ob.height/2+20);
            ctx.stroke();
        }
    } else if(ob.type === "heal") {
        if(healImage.complete && healImage.naturalWidth !== 0){
            ctx.drawImage(healImage, ob.x, ob.y, ob.width, ob.height);
        } else {
            const cx = ob.x + ob.width/2, cy = ob.y + ob.height/2;
            ctx.fillStyle = "red";
            ctx.beginPath();
            ctx.arc(cx-5, cy-2, 6, 0, Math.PI*2);
            ctx.arc(cx+5, cy-2, 6, 0, Math.PI*2);
            ctx.moveTo(cx-11, cy+2);
            ctx.quadraticCurveTo(cx, cy+18, cx+11, cy+2);
            ctx.closePath();
            ctx.fill();
        }
    } else if(ob.type === "breakable") {
        if(breakableImage.complete && breakableImage.naturalWidth !== 0){
            ctx.drawImage(breakableImage, ob.x, ob.y, ob.width, ob.height);
        } else {
            ctx.fillStyle = "orange";
            ctx.beginPath();
            ctx.moveTo(ob.x + ob.width/2, ob.y + ob.height);
            ctx.lineTo(ob.x, ob.y);
            ctx.lineTo(ob.x + ob.width, ob.y);
            ctx.closePath();
            ctx.fill();
        }
    } else if(ob.type === "zigzag") {
        if(zigzagImage.complete && zigzagImage.naturalWidth !== 0){
            ctx.drawImage(zigzagImage, ob.x, ob.y, ob.width, ob.height);
        } else {
            ctx.fillStyle = "purple";
            ctx.fillRect(ob.x, ob.y, ob.width, ob.height);
        }
    } else if(ob.type === "normal") {  // ここを追加
        if(normalImage.complete && normalImage.naturalWidth !== 0){
            ctx.drawImage(normalImage, ob.x, ob.y, ob.width, ob.height);
        } else {
            const baseColor = "green";
            const cx = ob.x + ob.width / 2;
            const cy = ob.y + ob.height / 2;
            const radius = ob.width / 2;

            ctx.fillStyle = baseColor;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fill();

            const spikes = 8;
            for (let i = 0; i < spikes; i++) {
                const angle = (Math.PI * 2 / spikes) * i;
                const spikeLength = radius * 0.7;
                const sx = cx + Math.cos(angle) * radius;
                const sy = cy + Math.sin(angle) * radius;
                const ex = cx + Math.cos(angle) * (radius + spikeLength);
                const ey = cy + Math.sin(angle) * (radius + spikeLength);

                ctx.strokeStyle = baseColor;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(ex, ey);
                ctx.stroke();
            }
        }
    } else {
        // その他の障害物は適宜追加
    }
});


  // 穴（GROUND_Y を使用）
  ctx.fillStyle = "black"; holes.forEach(h => ctx.fillRect(h.x, GROUND_Y, h.width, 30) );

  // 爆発
  explosions.forEach(e => { ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2); ctx.fillStyle = e.color || "rgba(255,165,0,0.5)"; ctx.fill(); });

  // フラッシュ
  if(flash>0){ ctx.fillStyle="rgba(255,255,255,0.5)"; ctx.fillRect(0,0,canvas.width,canvas.height); flash--; }

  // プレイヤー描画（画像が準備できていれば画像で、なければ丸）
  if(playerImage.complete && playerImage.naturalWidth !== 0){
    ctx.save();
    ctx.drawImage(playerImage, player.x, player.y, player.size, player.size);
    ctx.restore();
  } else {
    ctx.fillStyle = "pink";
    ctx.beginPath(); ctx.arc(player.x + player.size/2, player.y + player.size/2, player.size/2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "black"; ctx.beginPath(); ctx.arc(player.x+7, player.y+8, 2, 0, Math.PI*2); ctx.arc(player.x+13, player.y+8, 2, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "black"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(player.x+6, player.y+14); ctx.lineTo(player.x-2, player.y+12); ctx.moveTo(player.x+14, player.y+14); ctx.lineTo(player.x+22, player.y+12); ctx.stroke();
  }

  // HPバー
  const hpWidth = 22, hpHeight = 18;
  ctx.fillStyle="gray"; ctx.fillRect(10,10,hpWidth*3,hpHeight);
  ctx.fillStyle="lime"; ctx.fillRect(10,10,hpWidth*Math.max(0,hp),hpHeight);

  // スコア / 距離
  ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(canvas.width-220,10,210,24);
  ctx.fillStyle="white"; ctx.font="14px sans-serif"; ctx.textAlign="right";
  ctx.fillText(`スコア:${score}  距離:${Math.floor(distance)}  秒:${Math.floor(gameTime/60)}`, canvas.width-12, 28);

  // ゴールライン
  if(goalLine){
    ctx.fillStyle = "gold"; ctx.fillRect(goalLine.x, 220, goalLine.width, 50);
    ctx.fillStyle = "black"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("GOAL", goalLine.x + goalLine.width/2, 215);
  }

  // 花火描画
  drawFireworks();

  // GameOver / Clear 表示
  if(gameOver){
    ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(0,80,canvas.width,80);
    ctx.fillStyle="red"; ctx.textAlign="center"; ctx.font="bold 30px sans-serif"; ctx.fillText("Game Over!", canvas.width/2, 105);
    ctx.fillStyle="white"; ctx.font="14px sans-serif"; ctx.fillText("リスタートボタンで再挑戦", canvas.width/2, 130);
  }
  if(gameClear){
    ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(0,80,canvas.width,80);
    ctx.fillStyle="lime"; ctx.textAlign="center"; ctx.font="bold 30px sans-serif"; ctx.fillText("Game Clear!", canvas.width/2, 105);
    ctx.fillStyle="white"; ctx.font="14px sans-serif"; ctx.fillText("リスタートボタンで再挑戦", canvas.width/2, 130);
  }
}

/* =========================
   メインループ
   ========================= */
function loop(){
  if(!gameOver && !gameClear){
    distance += worldSpeed;

    // 山スクロール
    mountains.forEach(m=>{
      m.x -= 0.5;
      if(m.x <= -W) m.x += 2*W;
      if(m.x >= 2*W) m.x -= 2*W;
    });

    // 雲スクロール
    clouds.forEach(c=>{
      c.x -= c.speed;
      if(c.x < -60) c.x = canvas.width + 60;
    });

    // ゴール出現判定
    if(!goalLine && distance >= goalDistance * 1.5 && score >= goalScore * 1.5){
      goalLine = { x: canvas.width + 100, width: 12 };
      playGoalSound();
      showMsg("ゴールライン出現！", 2000);
    }

    // ゴール判定／クリア処理
    if(goalLine){
      goalLine.x -= worldSpeed;
      if(player.x + player.size > goalLine.x){
        gameClear = true;
        bgmPlayer.fadeOut(0.02, 120);
        playClearSound();
        let cnt = 0;
        const t = setInterval(()=>{
          spawnFireworks(canvas.width/2 + (Math.random()-0.5)*120, 120 + Math.random()*40, 8);
          const se = new Audio(fireworkSEPath);
          se.volume = 0.6;
          se.play();
          cnt++; if(cnt>=7) clearInterval(t);
        }, 400);
        showMsg("クリア！ 花火！", 3000);
      }
    }

    // 時間減少
    gameTime--; if(gameTime <= 0) endGame();

    // プレイヤー物理
    if(player.falling){
      player.vy += 0.9;
      player.y += player.vy;
      if(player.y > canvas.height + 40) endGame();
    } else {
      player.vy += 0.5;
      player.y += player.vy;
      // 着地判定を GROUND_Y に合わせる（player.size に依存）
      if(player.y > GROUND_Y - player.size){
        player.y = GROUND_Y - player.size;
        player.vy = 0;
        jumpStage = 0;
      }
    }

    // 障害物
    spawnTimer++; if(spawnTimer > 90){ spawnObstacle(); spawnTimer = 0; }
    spawnHoleIfReady(); updateObstacles();

    if(invincible>0) invincible--;
    checkCollision();
    updateExplosions();
  }

  updateFireworks();
  draw();
  requestAnimationFrame(loop);
}

/* =========================
   Game Over / Restart
   ========================= */
function endGame(){
  gameOver = true;
  showMsg("ゲームオーバー", 2000);
  try { bgmPlayer.stop(); } catch(e){ /* ignore */ }
}

function restart(){
  resetGameState();
  _bgmPlayAttempted = false;
  showMsg("ゲームを開始しました", 1200);
  tryPlayBGMOnce(true);
}

/* =========================
   BGM 再生トリガ（ユーザー操作関連）
   ========================= */
let _bgmPlayAttempted = false;
function tryPlayBGMOnce(force=false){
  if(_bgmPlayAttempted && !force) return;
  _bgmPlayAttempted = true;
  bgmPlayer.play().then(()=> {
    showMsg("BGM再生中",1000);
  }).catch(err => {
    console.log("BGM再生できませんでした:", err);
    showMsg("ブラウザがBGM再生をブロックしました。操作で再生してください。", 2500);
  });
}

/* =========================
   初期化 & 起動
   ========================= */
resetGameState();
if(!loopStarted){ loopStarted = true; requestAnimationFrame(loop); }

/* デバッグ用公開 */
window._game = { restart, tryPlayBGMOnce, bgmPlayer, setPlayerSize: (s)=>{ player.size = s; player.y = GROUND_Y - s; } };

</script>
</body>
