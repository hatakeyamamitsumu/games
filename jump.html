<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ジャンプゲーム — パラシュート実装版</title>
<style>
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,"Hiragino Kaku Gothic ProN",sans-serif; background:#f8f8f8; display:flex; flex-direction:column; align-items:center; }
  h2 { margin:12px 0; }
  #canvasWrap { margin:0 auto; }
  canvas { border:1px solid #222; background:lightblue; image-rendering:pixelated; display:block; }
  #buttonArea { margin:12px 0; display:flex; gap:12px; width:420px; justify-content:center; }
  button { font-size:20px; padding:14px 22px; border-radius:10px; border:none; background:orange; color:white; cursor:pointer; }
  button:active { background:darkorange; }
  #rules { max-width:720px; text-align:left; padding:10px; font-size:14px; color:#222; }
  #msg { position:fixed; top:6px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.6); color:white; padding:6px 12px; border-radius:8px; font-size:13px; display:none; z-index:999; }
</style>
</head>
<body>
<h2>ジャンプゲーム 🎈（パラシュート実装）</h2>
<div id="canvasWrap"><canvas id="game" width="400" height="300"></canvas></div>

<div id="buttonArea">
  <button id="restartBtn">リスタート</button>
  <button id="jumpBtn">ジャンプ（Space）</button>
</div>

<div id="rules">
  <h3>ルール</h3>
  <ul>
    <li>スペースキーかジャンプボタン:ジャンプ。2回目で空中ジャンプ。3回目でパラシュート落下。</li>
    <li>オレンジ、：上から踏んだら倒せる</li>
    <li>緑、ボール、ヤカン、火の玉：倒せない</li>
    <li>風船：どこから当たっても倒せる</li>
    <li>ハート：体力回復</li>
  </ul>
</div>

<div id="msg"></div>

<script>
/* ---------- BGMPlayer（そのまま） ---------- */
class BGMPlayer {
  constructor(src, opts={volume:0.7, loop:true}) {
    this.src = src;
    this.audio = new Audio(src);
    this.audio.loop = !!opts.loop;
    this.audio.volume = typeof opts.volume === 'number' ? opts.volume : 1.0;
    this._isPlaying = false;
  }
  play() { return this.audio.play().then(()=>{ this._isPlaying=true; }).catch(e=>{ this._isPlaying=false; throw e; }); }
  pause(){ this.audio.pause(); this._isPlaying=false; }
  stop(){ this.pause(); this.audio.currentTime = 0; }
  fadeOut(step=0.02, interval=100){
    const audio = this.audio;
    const fade = setInterval(()=>{ if(audio.volume > step){ audio.volume = Math.max(0, audio.volume - step); } else { audio.volume = 0; audio.pause(); clearInterval(fade); } }, interval);
  }
  setVolume(v){ this.audio.volume = Math.max(0, Math.min(1, v)); }
  isPlaying(){ return this._isPlaying && !this.audio.paused; }
}

/* ========================= グローバル設定 ========================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const GROUND_Y = 270;
const OB_FALL_THRESHOLD = GROUND_Y - 40;
const worldSpeedDefault = 2;
let worldSpeed = worldSpeedDefault;
const goalDistance = 1200;
const goalScore = 30;

/* 上限（重要） */
const MAX_OBSTACLES = 40;     // 障害物の総数上限（これ以上は生成しない）
const SPAWN_INTERVAL = 110;   // 障害物生成間隔（フレーム）

/* ========================= 変数 ========================= */
let player, jumpStage, maxJumpStage, obstacles, explosions, holes;
let fireworks;
let score, gameOver, spawnTimer, holeTimer, gameTime, hp, invincible, flash;
let distance = 0;
let goalLine = null;
let gameClear = false;
let loopStarted = false;

/* 画像（パスがあれば表示） */
const playerImage = new Image(); playerImage.src = "characters/hero/hero.png";
const normalImage = new Image(); normalImage.src = "characters/normal/normal.png";
const zigzagImage = new Image(); zigzagImage.src = "characters/zigzag/zigzag.png";
const balloonImage = new Image(); balloonImage.src = "characters/baloon/baloon.png";
const breakableImage = new Image(); breakableImage.src = "characters/breakable/breakable.png";
const healImage = new Image(); healImage.src = "characters/heal/heal.png";
const chaserImage = new Image(); chaserImage.src = "characters/chaser/chaser.png";
const chaser2Image = new Image(); chaser2Image.src = "characters/chaser2/chaser2.png";
const wiggleImage = new Image(); wiggleImage.src = "characters/wiggle/wiggle1.png";
const bouncerImage = new Image(); bouncerImage.src = "characters/bouncer/bouncer1.png";
const goalImage = new Image(); goalImage.src = "graphics/goal/goal1.png";
const cloudImage = new Image(); cloudImage.src = "graphics/cloud/cloud1.png";
const mountainImage = new Image(); mountainImage.src = "graphics/mountain/mountain1.png";

/* forest files (optional) */
const forestFiles = [
  "graphics/forest/forest1.png",
  "graphics/forest/forest2.png",
  "graphics/forest/forest3.png",
  "graphics/forest/forest4.png",
];
const forestImageObjects = forestFiles.map(src => { const img = new Image(); img.src = src; return img; });

/* タイル関連 */
let forestTiles = [];
const FOREST_HEIGHT = 60;
const FOREST_SPEED_FACTOR = 0.5;

/* Sound/BGM */
const bgmPlayer = new BGMPlayer("sounds/BGM/a.mp3", {volume:0.05, loop:true});
const fireworkSEPath = "sounds/Sound_Effect/firework.mp3";

/* UI */
const msgBox = document.getElementById('msg');
function showMsg(text, ms=1800){ msgBox.textContent=text; msgBox.style.display='block'; clearTimeout(showMsg._t); showMsg._t=setTimeout(()=>msgBox.style.display='none', ms); }

/* clouds & mountains (mountains は reset 前に初期化しておく) */
const clouds = [
  {x:80, y:50, scale:1, speed:0.2},
  {x:220, y:70, scale:0.8, speed:0.15},
  {x:340, y:40, scale:1.2, speed:0.25}
];

const numMountains = 2;
const mountains = [];
const mountainWidth = 400;
const mountainHeight = 120;
const minGap = 400;
let currentX = 0;
for (let i = 0; i < numMountains; i++) {
  mountains.push({ x: currentX, image: mountainImage });
  currentX += mountainWidth + minGap + Math.random() * 200;
}
function repositionMountain(m, index) {
  let tries = 0;
  do {
    let maxX = 0;
    mountains.forEach((other, i) => { if (i !== index) maxX = Math.max(maxX, other.x + mountainWidth); });
    m.x = maxX + minGap + Math.random() * 200;
    tries++;
  } while (mountains.some((other, i) => i !== index && Math.abs(other.x - m.x) < mountainWidth) && tries < 10);
}
function drawMountains() {
  mountains.forEach((m, index) => {
    m.x -= 0.2;
    if (m.x + mountainWidth < -200) repositionMountain(m, index);
    if (m.image.complete) ctx.drawImage(m.image, m.x, GROUND_Y - mountainHeight, mountainWidth, mountainHeight);
    else { ctx.fillStyle = "#9ACD9A"; ctx.fillRect(m.x, GROUND_Y - mountainHeight, mountainWidth, mountainHeight); }
  });
}
function drawCloud(c){
  if (cloudImage.complete && cloudImage.naturalWidth > 0) {
    const desiredHeight = 40 * c.scale;
    const aspect = cloudImage.naturalWidth / cloudImage.naturalHeight;
    const drawW = Math.round(desiredHeight * aspect);
    const drawH = Math.round(desiredHeight);
    const dx = Math.round(c.x - drawW / 2);
    const dy = Math.round(c.y - drawH / 2);
    ctx.drawImage(cloudImage, dx, dy, drawW, drawH);
  } else {
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath();
    ctx.arc(c.x, c.y, 20 * c.scale, 0, Math.PI * 2);
    ctx.arc(c.x + 15 * c.scale, c.y - 10 * c.scale, 15 * c.scale, 0, Math.PI * 2);
    ctx.arc(c.x + 30 * c.scale, c.y, 20 * c.scale, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fill();
  }
}

/* 初期化 */
function resetGameState(){
  const initialSize = 30;
  player = {
    x:120,
    y: GROUND_Y - initialSize,
    vy:0,
    size: initialSize,
    falling:false,
    onPlatform: null,
    inPit:false,
    _fallSoundPlayed: false,
    _fallStarted: false,
    // parachute
    parachute: false,
    parachuteTimer: 0
  };
  jumpStage = 0; maxJumpStage = 3; // ← 3段目でパラシュート
  obstacles = []; explosions = []; holes = [];
  fireworks = [];
  score = 0; spawnTimer = 0; holeTimer = 0;
  gameTime = 6000;
  hp = 4; invincible = 0; flash = 0;
  distance = 0; goalLine = null; gameClear = false; gameOver = false;
  worldSpeed = worldSpeedDefault;

  // mountains & clouds initial (軽量)
  if (mountains.length >= 2) { mountains[0].x = 0; mountains[1].x = W; }
  if (clouds.length >= 3){ clouds[0].x = 80; clouds[1].x = 220; clouds[2].x = 340; }

  initForest();
}

/* forest 初期化 */
function initForest(){
  forestTiles = [];
  let x = 0;
  const targetWidth = canvas.width * 1.5;
  while (x < targetWidth) {
    const img = forestImageObjects.length ? forestImageObjects[Math.floor(Math.random() * forestImageObjects.length)] : null;
    const aspect = (img && img.naturalWidth && img.naturalHeight) ? (img.naturalWidth / img.naturalHeight) : 3;
    const w = Math.round(FOREST_HEIGHT * aspect) || Math.round(FOREST_HEIGHT * 3);
    forestTiles.push({ image: img, x: x, w: w });
    x += w;
    if (forestTiles.length > 30) break;
  }
}

/* forest 更新 */
function updateForest(){
  const speed = worldSpeed * FOREST_SPEED_FACTOR;
  for (let t of forestTiles){ t.x -= speed; }
  function rightmostX(){
    let max = -99999;
    for (let t of forestTiles){
      const img = t.image;
      const aspect = (img && img.naturalWidth && img.naturalHeight) ? (img.naturalWidth / img.naturalHeight) : (t.w / Math.max(1, FOREST_HEIGHT));
      const drawW = Math.round(FOREST_HEIGHT * aspect) || t.w;
      max = Math.max(max, t.x + drawW);
    }
    return max;
  }
  for (let t of forestTiles){
    const img = t.image;
    const aspect = (img && img.naturalWidth && img.naturalHeight) ? (img.naturalWidth / img.naturalHeight) : (t.w / Math.max(1, FOREST_HEIGHT));
    const drawW = Math.round(FOREST_HEIGHT * aspect) || t.w;
    if (t.x + drawW < -50) {
      const rx = rightmostX();
      t.x = rx + 2;
    }
  }
}

/* 花火系（軽量） */
function spawnFireworks(cx, cy, bursts = 6){
  const colors = ["#ff5050","#ffb84d","#fff06a","#7efc8d","#8ad4ff","#d6a0ff","#ffffff","#ff69b4"];
  for(let b=0;b<bursts;b++){
    const particles = 18 + Math.floor(Math.random()*24);
    for(let i=0;i<particles;i++){
      const angle = Math.random()*Math.PI*2;
      const speed = 2 + Math.random()*4;
      const vx = Math.cos(angle) * speed * (0.6 + Math.random()*0.8);
      const vy = Math.sin(angle) * speed * (0.6 + Math.random()*0.8);
      const life = 40 + Math.floor(Math.random()*60);
      const size = 1 + Math.random()*3;
      const color = colors[Math.floor(Math.random()*colors.length)];
      fireworks.push({ x: cx + (Math.random()-0.5)*20, y: cy + (Math.random()-0.5)*20, vx, vy, size, color, life, age:0, alpha:1 });
    }
  }
}
function updateFireworks(){ for(let p of fireworks){ p.age++; p.vy += 0.04; p.vx *= 0.995; p.vy *= 0.998; p.x += p.vx; p.y += p.vy; p.alpha = Math.max(0, 1 - p.age / p.life); } fireworks = fireworks.filter(p => p.age < p.life); }
function drawFireworks(){ for(let p of fireworks){ ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); } ctx.globalAlpha = 1; }

/* 入力（ジャンプ） */
const gravity = 0.6;
function doJump() {
  if (gameOver || gameClear) return;
  tryPlayBGMOnce();

  if (player.onPlatform) jumpStage = 0;

  // 1回目・2回目は通常ジャンプ（maxJumpStage-1 回）
  if (jumpStage < maxJumpStage - 1) {
    jumpStage++;
    player.vy = -15;
    player.onPlatform = null;
    player.falling = true;
    player.inPit = false;
    // パラシュートは解除（安全）
    player.parachute = false;
    player.parachuteTimer = 0;
    playJumpSound();
    return;
  }

  // 最後の（3回目）押下でパラシュートを展開（上方向に跳ね上げない）
  if (jumpStage < maxJumpStage) {
    jumpStage++;
    player.onPlatform = null;
    player.falling = true;
    player.inPit = false;
    player.parachute = true;
    player.parachuteTimer = 0;
    // 現在上向きなら急な上昇を抑える（ゆるく浮かせる）
    if (player.vy < -3) player.vy = -3;
    if (player.vy > 1.2) player.vy = 1.2; // すでに速く落ちているなら程よく抑制
    // パラシュート展開音（任意）
    try { playSoundSequence([{freq:220,type:"sine",duration:0.18}]); } catch(e){}
    return;
  }
}
document.addEventListener("keydown", e=>{ if(e.code==="Space"){ e.preventDefault(); doJump(); } if(e.code==="Enter" && (gameOver || gameClear)) restart(); });
document.getElementById("jumpBtn").addEventListener("click", doJump);
document.getElementById("restartBtn").addEventListener("click", ()=>{ tryPlayBGMOnce(true); restart(); });
canvas.addEventListener("touchstart", e=>{ e.preventDefault(); doJump(); }, {passive:false});

/* SE（簡易） */
function playSoundSequence(seq){ const audioCtx = new (window.AudioContext || window.webkitAudioContext)(); seq.forEach(({freq,type="sine",duration=0.2,delay=0,volume=0.2})=>{ const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = type; osc.frequency.value = freq; const startTime = audioCtx.currentTime + delay; gain.gain.setValueAtTime(volume,startTime); gain.gain.exponentialRampToValueAtTime(0.001,startTime+duration); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(startTime); osc.stop(startTime+duration+0.05); }); }
function playJumpSound(){ playSoundSequence([{freq:jumpStage===1?440:550,type:"triangle",duration:0.12}]); }
function playDamageSound(){ playSoundSequence([{freq:160,type:"square",duration:0.22},{freq:80,type:"square",duration:0.22,delay:0.08}]); }
function playFallSound(){ playSoundSequence([{freq:120,type:"sine",duration:1.2}]); }
function playHealSound(){ playSoundSequence([{freq:523,type:"sine",duration:0.25},{freq:784,type:"sine",duration:0.25,delay:0.18}]); }
function playEnemyDefeatSound(){ playSoundSequence([{freq:420,type:"triangle",duration:0.12},{freq:560,type:"triangle",duration:0.12,delay:0.08}]); }
function playGoalSound(){ playSoundSequence([{freq:880,type:"sine",duration:0.25},{freq:660,type:"sine",duration:0.25,delay:0.2}]); }
function playClearSound(){ playSoundSequence([{freq:1200,type:"sine",duration:0.25},{freq:900,type:"sine",duration:0.2,delay:0.18},{freq:700,type:"sine",duration:0.18,delay:0.34}]); }

/* ========================= 障害物生成（安全化・bouncer対応） ========================= */
function spawnObstacle(){
  const count = Math.floor(Math.random()*3)+1;
  for(let i=0;i<count;i++){
    if (obstacles.length >= MAX_OBSTACLES) break;

    const r = Math.random();
    let type;
    if (i === 0 && r < 0.08) type = "chaser";
    else if (i === 0 && r < 0.10) type = "chaser2"; // 0.08〜0.10
    else if (r < 0.18) type = "heal";
    else if (r < 0.26) type = "platform";
    else if (r < 0.30) type = "wiggle";
    else if (r < 0.34) type = "bouncer"; // wiggle後の0.30〜0.34 
    else type = ["normal","zigzag","breakable","balloon"][Math.floor(Math.random()*4)];

    let yPos = GROUND_Y - 30, baseY;
    let width = 20, height = 20;

    switch(type){
      case "heal": yPos = 30 + Math.random()*50; width = 26; height = 26; break;
      case "balloon": yPos = 50 + Math.random()*100; width = 26; height = 26; break;
      case "zigzag": baseY = 140 + Math.random()*60; yPos = baseY; width = 26; height = 26; break;
      case "normal":
      case "breakable":
        yPos = (Math.random() < 0.5) ? GROUND_Y - 30 : 90 + Math.random()*60; width = 26; height = 26; break;
      case "chaser":
        yPos = (Math.random()<0.5) ? GROUND_Y - 20 : 100 + Math.random()*100; width = 26; height = 26; break;
      case "chaser2":
        yPos = 0; width = 26; height = 26; break;
      case "platform":
        width = 40 + Math.floor(Math.random()*80); height = 12;
        yPos = 120 + Math.random()*(GROUND_Y - 160);
        break;
    }

    if(type === "chaser"){
      const startX = W + 10, startY = -10;
      const targetX = player.x + player.size/2, targetY = player.y + player.size/2;
      const dx = targetX - startX, dy = targetY - startY;
      const len = Math.hypot(dx, dy) || 1;
      const speed = 4 + Math.random()*1.2;
      const vx = (dx / len) * speed, vy = (dy / len) * speed;
      obstacles.push({ x: startX, y: startY, width, height, type: "chaser", vx, vy, angle:0, vyPhys:0, falling:false, scored:false });
    }
    else if(type === "chaser2"){
      const startX = -6, startY = -6;
      const targetX = player.x + player.size / 2, targetY = player.y - 80;
      const dx = targetX - startX, dy = targetY - startY;
      const len = Math.hypot(dx, dy) || 1;
      const speed = 2 + Math.random();
      const vx = (dx / len) * speed, vy = (dy / len) * speed;
      obstacles.push({ x: startX, y: startY, width: 26, height: 26, type: "chaser2", vx, vy, angle:0, vyPhys:0, falling:false, scored:false });
    }
    else if(type === "wiggle"){
      const baseX = W + i*30;
      const baseYv = 100 + Math.random() * (GROUND_Y - 150);
      const speedX = 1 + Math.random()*1.2;
      const ampX = 8 + Math.random()*16;
      const freqX = 0.008 + Math.random()*0.02;
      const ampY = 12 + Math.random()*28;
      const freqY = 0.008 + Math.random()*0.02;
      obstacles.push({
        x: baseX, y: baseYv, width: 26, height: 26, type: "wiggle",
        baseX, baseY: baseYv, speedX, ampX, freqX, ampY, freqY, t: 0, angle: 0, vy: 0, falling: false, scored: false
      });
    }
    else if (type === "bouncer") {
      const startX = -30;
      const startY = 40 + Math.random() * 80;
      const speedX = 1.0 + Math.random() * 1.4;
      obstacles.push({
        x: startX, y: startY, width: 24, height: 24, type: "bouncer",
        vx: speedX, vy: 0, bounce: 0.65 + Math.random()*0.25, falling: false, scored: false
      });
    }
    else {
      obstacles.push({ x: W + i*30, y: yPos, width, height, type, angle: 0, vy: 0, falling: false, baseY: baseY, scored: false });
    }
  }
}

/* 穴生成 */
function spawnHoleIfReady(){
  holeTimer++;
  if(holeTimer >= 140){
    if(Math.random() < 0.45) holes.push({x:W, width:70});
    holeTimer = 0;
  }
}

/* ========================= updateObstacles（bouncer 対応） ========================= */
function updateObstacles(){
  for(let ob of obstacles){
    ob.prevX = ob.x;
    ob.prevY = ob.y;

    if(ob.falling){
      ob.vy += 0.6;
      ob.y += ob.vy;
      if(ob.vx !== undefined) ob.x += ob.vx;
    } else if (ob.vx !== undefined && (ob.type === "chaser" || ob.type === "chaser2" || ob.type === "bouncer")) {
      ob.x += ob.vx;
      ob.y += ob.vy;

      if (ob.type === "bouncer") {
        for (let h of holes) {
          if (!ob.falling && (ob.x + ob.width > h.x && ob.x < h.x + h.width) && ob.y >= OB_FALL_THRESHOLD) {
            ob.falling = true;
            ob.vy = 2;
            break;
          }
        }

        if (!ob.falling) {
          for (let plat of obstacles) {
            if (plat.type !== "platform") continue;
            const overlap = (ob.x + ob.width > plat.x) && (ob.x < plat.x + plat.width);
            if (overlap && (ob.prevY + ob.height <= plat.y) && (ob.y + ob.height >= plat.y)) {
              ob.y = plat.y - ob.height;
              ob.vy = -Math.abs(ob.vy || 0) * (ob.bounce || 0.7);
              if (Math.abs(ob.vy) < 2) ob.vy = -3 - Math.random()*2;
              ob.vx *= 0.98;
            }
          }
          if (ob.y + ob.height >= GROUND_Y) {
            ob.y = GROUND_Y - ob.height;
            ob.vy = -Math.abs(ob.vy || 0) * (ob.bounce || 1.0);
            if (Math.abs(ob.vy) < 2) ob.vy = -3 - Math.random()*3;
            ob.vx *= 0.98;
          } else {
            ob.vy += 0.4;
          }
        }
      }
    } else {
      const speed = (ob.type === "balloon" || ob.type === "heal") ? worldSpeed * 0.6 : worldSpeed;

      if (ob.type === "wiggle") {
        ob.t = (ob.t || 0) + 1;
        const moveSpeed = (ob.speedX || worldSpeed * 0.5);
        const ampX = ob.ampX || 12;
        const freqX = ob.freqX || 0.01;
        const ampY = ob.ampY || 24;
        const freqY = ob.freqY || 0.01;
        ob.x = ob.baseX - moveSpeed * ob.t + Math.sin(ob.t * freqX * 2 * Math.PI) * ampX;
        ob.y = ob.baseY + Math.sin(ob.t * freqY * 2 * Math.PI) * ampY;
      } else {
        ob.x -= speed;

        if(ob.type === "zigzag" && ob.baseY !== undefined){
          ob.y = ob.baseY + Math.sin(ob.angle || 0) * 30;
          ob.angle = (ob.angle || 0) + 0.12;
        }

        if(ob.type === "balloon" || ob.type === "heal"){
          ob.y += Math.sin(ob.angle || 0) * 0.6;
          ob.x += Math.sin((ob.angle || 0) / 2) * 0.4;
          ob.angle = (ob.angle || 0) + 0.06;
        }

        if(!ob.falling && (ob.type === "normal" || ob.type === "breakable")){
          for(let h of holes){
            if(ob.x + ob.width > h.x && ob.x < h.x + h.width && ob.y >= OB_FALL_THRESHOLD){
              ob.falling = true; ob.vy = 2; break;
            }
          }
        }
      }
    }
  }

  obstacles = obstacles.filter(ob=>{
    const outOfScreen = (ob.x < -ob.width*2) || (ob.x > canvas.width + ob.width*2) || (ob.y < -ob.height*2) || (ob.y > canvas.height + ob.height*2);
    if(!ob.falling && outOfScreen){
      if (!ob.scored && ob.type !== "chaser" && ob.type !== "chaser2") { score++; ob.scored = true; }
      return false;
    }
    if(ob.falling && ob.y > canvas.height +1) return false;
    return true;
  });

  holes.forEach(h => h.x -= worldSpeed);
  holes = holes.filter(h => h.x + h.width > 0);
}

/* ========================= 衝突判定 ========================= */
function checkCollision() {
  if (invincible > 0 || gameClear) return;

  for (let i = 0; i < obstacles.length; i++) {
    const ob = obstacles[i];
    if (ob.falling) continue;

    const playerCenterX = player.x + player.size / 2;
    const playerCenterY = player.y + player.size / 2;
    const obCenterX = ob.x + ob.width / 2;
    const obCenterY = ob.y + ob.height / 2;
    const dx = playerCenterX - obCenterX;
    const dy = playerCenterY - obCenterY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    // Heal
    if (ob.type === "heal" && dist < player.size / 2 + 14) {
      explosions.push({ x: obCenterX, y: obCenterY, radius: 0, maxRadius: 60, color: "rgba(255,50,50,0.6)" });
      obstacles.splice(i, 1); i--;
      hp = 4; score += 10; flash = 8; invincible = 30;
        // ★ パラシュート解除 ★
  player.parachute = false;
  player.parachuteTimer = 0;
      playHealSound();
      continue;
    }

    // Balloon（当たったら小さく弾くが画面外へ行かないように抑える）
    if (ob.type === "balloon" && dist < player.size / 2 + 16) {
      explosions.push({ x: obCenterX, y: obCenterY, radius: 0, maxRadius: 30 });
      obstacles.splice(i, 1); i--;
      score += 5; gameTime += 60;

      // 敵接触したらパラシュートを解除（要求された動作）
      player.parachute = false;
      player.parachuteTimer = 0;

      // 上方向の反動を強すぎない値に
      player.vy = (playerCenterY < obCenterY) ? -6 : 4;
      invincible = 30; flash = 10;
      playEnemyDefeatSound();
      continue;
    }

    // 敵（踏み/接触）のブロック：接触した瞬間にパラシュートを解除する
    if (["normal", "zigzag", "breakable", "chaser", "chaser2", "wiggle","bouncer"].includes(ob.type) &&
        player.x < ob.x + ob.width && player.x + player.size > ob.x &&
        player.y < ob.y + ob.height && player.y + player.size > ob.y) {

      // ← 接触時にパラシュート解除（ここが重要）
      player.parachute = false;
      player.parachuteTimer = 0;

      // 上から踏んだ（breakable を壊す）判定
      if (ob.type === "breakable" && player.vy > 0 && player.y + player.size <= ob.y + 20) {
        explosions.push({ x: obCenterX, y: obCenterY, radius: 0, maxRadius: 30 });
        obstacles.splice(i, 1); i--;
        score += 5; gameTime += 60; player.vy = -8;
        playEnemyDefeatSound();
        continue;
      }

      if (ob.type === "chaser" || ob.type === "chaser2") {
        hp--; invincible = 30; flash = 10; playDamageSound();
        if (hp <= 0) return endGame();
        explosions.push({ x: obCenterX, y: obCenterY, radius: 0, maxRadius: 25 });
        obstacles.splice(i, 1); i--;
        continue;
      }

      if (ob.type === "bouncer") {
        hp--; invincible = 30; flash = 10; playDamageSound();
        if (hp <= 0) return endGame();
        explosions.push({ x: obCenterX, y: obCenterY, radius: 0, maxRadius: 20 });
        continue;
      }

      hp--; invincible = 30; flash = 10; playDamageSound();
      if (hp <= 0) return endGame();
    }
  }

  // 足元の穴（立っているとき）
  // 足元の穴（少しでも落ちたら即ゲームオーバー）
const footY = player.y + player.size;
if (footY >= GROUND_Y - 1) {
  for (let h of holes) {
    const margin = 2;
    const playerLeft = player.x + margin;
    const playerRight = player.x + player.size - margin;
    const holeLeft = h.x;
    const holeRight = h.x + h.width;

    // プレイヤーの足元が穴の範囲にかかっている場合
    if ((playerLeft < holeRight) && (playerRight > holeLeft)) {
      // 少しでも下に落ちた瞬間にゲームオーバー
      if (player.y > GROUND_Y) {
        return endGame();
      }

      // そうでない場合も「落下開始」状態に
      player.falling = true;
      player.inPit = true;
      player.vy = 2;
      return;
    }
  }
}
}

/* 爆発更新 */
function updateExplosions(){ for(let e of explosions) e.radius += 2; explosions = explosions.filter(e => e.radius < e.maxRadius); }

/* 描画 */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // 背景
  const bgGrad = ctx.createLinearGradient(0,0,0,canvas.height);
  bgGrad.addColorStop(0,"#3b75a8"); bgGrad.addColorStop(0.4,"#87CEEB"); bgGrad.addColorStop(1,"#f0f0f0");
  ctx.fillStyle = bgGrad; ctx.fillRect(0,0,canvas.width,canvas.height);

  drawMountains();
  clouds.forEach(c => drawCloud(c));

  // 地面
  const groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, canvas.height);
  groundGrad.addColorStop(0,"#6b3f1a"); groundGrad.addColorStop(1,"#A0522D");
  ctx.fillStyle = groundGrad; ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

  // 地面の凹凸（軽量）
  ctx.strokeStyle = "rgba(0,0,0,0.12)";
  for(let i=0;i<canvas.width;i+=10){
    const offset = Math.sin(i * 0.12 + distance * 0.02) * 2;
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(i, GROUND_Y + offset); ctx.lineTo(i, canvas.height); ctx.stroke();
  }

  // 森タイル
  if (forestTiles.length > 0) {
    for (let t of forestTiles) {
      const img = t.image;
      const aspect = (img && img.naturalWidth && img.naturalHeight) ? (img.naturalWidth / img.naturalHeight) : (t.w / Math.max(1, FOREST_HEIGHT));
      const drawW = Math.round(FOREST_HEIGHT * aspect) || t.w;
      if (img && img.complete && img.naturalWidth) {
        ctx.drawImage(img, Math.floor(t.x), GROUND_Y - FOREST_HEIGHT, drawW, FOREST_HEIGHT);
      } else {
        ctx.fillStyle = "#2e8b57";
        ctx.fillRect(Math.floor(t.x), GROUND_Y - FOREST_HEIGHT, drawW, FOREST_HEIGHT);
      }
    }
  }

  // 障害物
  obstacles.forEach(ob => {
    if(ob.type === "platform"){
      ctx.fillStyle = "#8B4513";
      ctx.fillRect(ob.x, ob.y, ob.width, ob.height);
      ctx.strokeStyle = "#543210";
      ctx.strokeRect(ob.x, ob.y, ob.width, ob.height);
      return;
    }

    let img =
        ob.type === "balloon"   ? balloonImage   :
        ob.type === "heal"      ? healImage      :
        ob.type === "breakable" ? breakableImage :
        ob.type === "zigzag"    ? zigzagImage    :
        ob.type === "normal"    ? normalImage    :
        ob.type === "chaser"    ? chaserImage    :
        ob.type === "chaser2"   ? chaser2Image   :
        ob.type === "wiggle"    ? wiggleImage    :
        ob.type === "bouncer"   ? bouncerImage   : null;

    if (img && img.complete && img.naturalWidth) {
      ctx.drawImage(img, ob.x, ob.y, ob.width, ob.height);
    } else {
      ctx.fillStyle =
        ob.type === "balloon"   ? "pink"   :
        ob.type === "heal"      ? "red"    :
        ob.type === "breakable" ? "orange" :
        ob.type === "zigzag"    ? "purple" :
        ob.type === "normal"    ? "green"  :
        ob.type === "chaser"    ? "black"  :
        ob.type === "chaser2"   ? "darkblue" :
        ob.type === "wiggle"    ? "cyan" :
        ob.type === "bouncer"   ? "brown" : "gray";

      ctx.beginPath();
      ctx.arc(ob.x + ob.width / 2, ob.y + ob.height / 2, Math.min(ob.width, ob.height) / 2, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // 穴
  ctx.fillStyle = "black";
  holes.forEach(h => ctx.fillRect(h.x, GROUND_Y, h.width, 30) );

  // 爆発
  explosions.forEach(e => { ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2); ctx.fillStyle = e.color || "rgba(255,165,0,0.5)"; ctx.fill(); });

  // フラッシュ
  if(flash>0){ ctx.fillStyle="rgba(255,255,255,0.5)"; ctx.fillRect(0,0,canvas.width,canvas.height); flash--; }

  // プレイヤー（パラシュートがあれば簡易表示）
  if(playerImage.complete && playerImage.naturalWidth !== 0){
    ctx.drawImage(playerImage, player.x, player.y, player.size, player.size);
  } else {
    ctx.fillStyle = "pink";
    ctx.beginPath(); ctx.arc(player.x + player.size/2, player.y + player.size/2, player.size/2, 0, Math.PI*2); ctx.fill();
  }

  // 簡易パラシュート描画（テスト用）
  if (player.parachute) {
    // 半透明の丸（傘）をプレイヤーの上に描く
    ctx.globalAlpha = 0.95;
    ctx.beginPath();
    ctx.ellipse(player.x + player.size/2, player.y - 6, player.size * 0.9, 10, 0, Math.PI, 2*Math.PI);
    ctx.fillStyle = "rgba(255,200,220,0.95)";
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // UI
  const hpWidth = 25, hpHeight = 18;
  ctx.fillStyle="gray"; ctx.fillRect(10,10,hpWidth*4,hpHeight);
  ctx.fillStyle="lime"; ctx.fillRect(10,10,hpWidth*Math.max(0,hp),hpHeight);
  ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(canvas.width-220,10,210,24);
  ctx.fillStyle="white"; ctx.font="14px sans-serif"; ctx.textAlign="right";
  ctx.fillText(`スコア:${score}  距離:${Math.floor(distance)}  秒:${Math.floor(gameTime/60)}`, canvas.width-12, 28);

  // goal
  if(goalLine){
    if(goalImage.complete && goalImage.naturalWidth){
      const gx = goalLine.x;
      const gy = GROUND_Y - goalLine.height;
      const scale = 2.0;
      ctx.drawImage(goalImage, gx, gy - (goalLine.height * (scale - 1)), goalLine.width * scale, goalLine.height * scale);
      ctx.fillStyle = "red"; ctx.font = "bold 24px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("GOAL", gx + goalLine.width / 2, gy - 6);
    } else {
      ctx.fillStyle = "gold";
      const gy = 220;
      ctx.fillRect(goalLine.x, gy, goalLine.width, 50);
      ctx.fillStyle = "black";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("GOAL", goalLine.x + goalLine.width/2, gy - 5);
    }
  }

  drawFireworks();

  if(gameOver){
    ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(0,80,canvas.width,80);
    ctx.fillStyle="red"; ctx.textAlign="center"; ctx.font="bold 30px sans-serif"; ctx.fillText("Game Over!", canvas.width/2, 105);
    ctx.fillStyle="white"; ctx.font="14px sans-serif"; ctx.fillText("リスタートボタンで再挑戦", canvas.width/2, 130);
  }
  if(gameClear){
    ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(0,80,canvas.width,80);
    ctx.fillStyle="lime"; ctx.textAlign="center"; ctx.font="bold 30px sans-serif"; ctx.fillText("Game Clear!", canvas.width/2, 105);
    ctx.fillStyle="white"; ctx.font="14px sans-serif"; ctx.fillText("リスタートボタンで再挑戦", canvas.width/2, 130);
  }
}

/* ========================= メインループ ========================= */
function loop(){
  if(!gameOver && !gameClear){
    distance += worldSpeed;

    // 背景／雲更新
    mountains.forEach(m=>{ m.x -= 0.5; if(m.x <= -W) m.x += 2*W; if(m.x >= 2*W) m.x -= 2*W; });
    clouds.forEach(c=>{ c.x -= c.speed; if(c.x < -60) c.x = canvas.width + 60; });

    updateForest();

    // ゴール判定（条件を厳しめ）
    if(!goalLine && distance >= goalDistance * 2.0 && score >= goalScore * 2.0){
      const defaultW = 80, defaultH = 80;
      let gw = defaultW, gh = defaultH;
      if(goalImage.complete && goalImage.naturalWidth){
        const scale = Math.min(1, 120 / goalImage.naturalWidth);
        gw = Math.round(goalImage.naturalWidth * scale);
        gh = Math.round(goalImage.naturalHeight * scale);
      }
      goalLine = { x: canvas.width + 100, width: gw, height: gh };
      playGoalSound();
      showMsg("ゴールライン出現！", 2000);
    }
    if(goalLine){
      goalLine.x -= worldSpeed;
      if(player.x + player.size > goalLine.x){
        gameClear = true;
        bgmPlayer.fadeOut(0.02, 120);
        playClearSound();
        let cnt = 0;
        const t = setInterval(()=>{
          spawnFireworks(canvas.width/2 + (Math.random()-0.5)*120, 120 + Math.random()*40, 6);
          const se = new Audio(fireworkSEPath); se.volume = 0.6; se.play();
          cnt++; if(cnt>=6) clearInterval(t);
        }, 400);
        showMsg("クリア！ 花火！", 3000);
      }
    }

    // 時間
    gameTime--; if(gameTime <= 0) endGame();

    // 1) 先に障害物を動かす
    updateObstacles();

    // 2) プレイヤー物理
    const prevY = player.y;
    const prevFootY = prevY + player.size;

    // プラットフォームに乗っているかの処理（元のロジックを保持）
    if(player.onPlatform){
      const p = player.onPlatform;
      const stillExists = obstacles.indexOf(p) !== -1 && p.type === "platform";
      const overlapX = stillExists && (player.x + player.size > p.x) && (player.x < p.x + p.width);
      if(!stillExists || !overlapX){
        player.onPlatform = null; player.falling = true; player.inPit = false;
        // ここでパラシュートは解除しておく（安全）
        player.parachute = false;
        player.parachuteTimer = 0;
        player.vy = Math.max(player.vy, 2);
      } else {
        player.y = p.y - player.size; player.vy = 0; player.falling = false;
        // 着地したらパラシュート解除
        player.parachute = false;
        player.parachuteTimer = 0;
      }
    }

    if(!player.onPlatform){
      // パラシュート中は重力を弱くして降下をゆっくりにする
      if (player.parachute) {
        const parachuteGravity = 0.08; // 小さいほどゆっくり
        player.vy += parachuteGravity;
        const parachuteMaxFall = 1.5;
        if (player.vy > parachuteMaxFall) player.vy = parachuteMaxFall;
        player.parachuteTimer = (player.parachuteTimer || 0) + 1;
        // 自動解除（任意）：長時間使わせたくない場合
        if (player.parachuteTimer > 360) { player.parachute = false; player.parachuteTimer = 0; }
      } else {
        player.vy += (player.falling ? 0.9 : 0.5);
      }
      player.y += player.vy;
    }

    const newFootY = player.y + player.size;

    if(player.vy > 0){
      let landingPlatform = null; let landingY = Infinity;
      for(let ob of obstacles){
        if(ob.type !== "platform") continue;
        const overlapX = (player.x + player.size > ob.x) && (player.x < ob.x + ob.width);
        if(!overlapX) continue;
        const topY = ob.y;
        if(topY >= prevFootY - 0.5 && topY <= newFootY + 0.5){
          if(topY < landingY){ landingY = topY; landingPlatform = ob; }
        }
      }
      if(landingPlatform){
        player.y = landingPlatform.y - player.size;
        player.vy = 0;
        player.falling = false;
        player.onPlatform = landingPlatform;
        player.inPit = false;
        // 着地でパラシュート解除
        player.parachute = false;
        player.parachuteTimer = 0;
        jumpStage = 0;
      } else {
        if(newFootY >= GROUND_Y){
          const footXCenter = player.x + player.size/2;
          let overPit = false;
          for(let h of holes){ if(footXCenter > h.x + 4 && footXCenter < h.x + h.width - 4){ overPit = true; break; } }
          if(overPit){
            player.inPit = true; player.falling = true;
          } else {
            player.inPit = false; player.falling = false; player.vy = 0; player.y = GROUND_Y - player.size; player.onPlatform = null; jumpStage = 0;
            player.parachute = false; player.parachuteTimer = 0;
          }
        }
      }
    }

    if(!player._fallStarted && player.inPit){
      if(player.y > GROUND_Y + 1) player._fallStarted = true;
    }
    if(player._fallStarted && !player._fallSoundPlayed){
      player._fallSoundPlayed = true; try { playFallSound(); } catch(e) {}
    }
    if(player.y > canvas.height + 50 && player._fallStarted) endGame();

    // spawn（制限付き）
    spawnTimer++;
    if(spawnTimer > SPAWN_INTERVAL){
      if (obstacles.length < MAX_OBSTACLES - 6) spawnObstacle();
      spawnTimer = 0;
    }
    spawnHoleIfReady();

    if(invincible>0) invincible--;
    checkCollision();
    updateExplosions();
  }

  updateFireworks();
  draw();
  requestAnimationFrame(loop);
}

/* ========================= Game Over / Restart ========================= */
function endGame(){
  gameOver = true;
  showMsg("ゲームオーバー", 2000);
  try { bgmPlayer.stop(); } catch(e){ }
}

function restart(){
  resetGameState();
  _bgmPlayAttempted = false;
  showMsg("ゲームを開始しました", 1200);
  tryPlayBGMOnce(true);
}

/* BGM トリガ */
let _bgmPlayAttempted = false;
function tryPlayBGMOnce(force=false){
  if(_bgmPlayAttempted && !force) return;
  _bgmPlayAttempted = true;
  bgmPlayer.play().then(()=> { showMsg("BGM再生中",1000); }).catch(err => { console.log("BGM再生できませんでした:", err); showMsg("ブラウザがBGM再生をブロックしました。操作で再生してください。", 2500); });
}

/* 初期化 & 起動 */
resetGameState();
if(!loopStarted){ loopStarted = true; requestAnimationFrame(loop); }

window._game = { restart, tryPlayBGMOnce, bgmPlayer, setPlayerSize: (s)=>{ player.size = s; player.y = GROUND_Y - s; } };

</script>
