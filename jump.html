<script>
/* ---------- BGMPlayer（そのまま） ---------- */
class BGMPlayer {
  constructor(src, opts={volume:0.7, loop:true}) {
    this.src = src;
    this.audio = new Audio(src);
    this.audio.loop = !!opts.loop;
    this.audio.volume = typeof opts.volume === 'number' ? opts.volume : 1.0;
    this._isPlaying = false;
  }
  play() { return this.audio.play().then(()=>{ this._isPlaying=true; }).catch(e=>{ this._isPlaying=false; throw e; }); }
  pause(){ this.audio.pause(); this._isPlaying=false; }
  stop(){ this.pause(); this.audio.currentTime = 0; }
  fadeOut(step=0.02, interval=100){
    const audio = this.audio;
    const fade = setInterval(()=>{ if(audio.volume > step){ audio.volume = Math.max(0, audio.volume - step); } else { audio.volume = 0; audio.pause(); clearInterval(fade); } }, interval);
  }
  setVolume(v){ this.audio.volume = Math.max(0, Math.min(1, v)); }
  isPlaying(){ return this._isPlaying && !this.audio.paused; }
}

/* ========================= グローバル設定 ========================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const GROUND_Y = 270;
const OB_FALL_THRESHOLD = GROUND_Y - 40;
const worldSpeedDefault = 2;
let worldSpeed = worldSpeedDefault;
const goalDistance = 2000;
const goalScore = 30;

/* 上限（重要） */

// グローバル変数
// =========================
const MAX_OBSTACLES = 40;     // 障害物の総数上限
const SPAWN_INTERVAL = 110;   // 障害物生成間隔（フレーム）

let player, jumpStage, maxJumpStage, obstacles, explosions, holes;
let fireworks;
let score, gameOver, spawnTimer, holeTimer, gameTime, hp, invincible, flash;
let distance = 0;
let goalLine = null;
let gameClear = false;
let loopStarted = false;

// -------------------------
// 前景関連

let foregrounds = [];  // 前景配列

const normalImage = new Image(); normalImage.src = "characters/normal/normal.png";
const zigzagImage = new Image(); zigzagImage.src = "characters/zigzag/zigzag.png";
const balloonImage = new Image(); balloonImage.src = "characters/baloon/baloon.png";
const breakableImage = new Image(); breakableImage.src = "characters/breakable/breakable.png";
const healImage = new Image(); healImage.src = "characters/heal/heal.png";
const chaserImage = new Image(); chaserImage.src = "characters/chaser/chaser.png";
const chaser2Image = new Image(); chaser2Image.src = "characters/chaser2/chaser2.png";
const chaser3Image = new Image(); chaser3Image.src = "characters/chaser3/chaser3.png";
const wiggleImage = new Image(); wiggleImage.src = "characters/wiggle/wiggle1.png";
const bouncerImage = new Image(); bouncerImage.src = "characters/bouncer/bouncer1.png";
const ninjyaImage = new Image(); ninjyaImage.src = "characters/ninjya/ninjya.png";
const goalImage = new Image(); goalImage.src = "graphics/goal/goal1.png";
const cloudImage = new Image(); cloudImage.src = "graphics/cloud/cloud1.png";
const mountainImage = new Image(); mountainImage.src = "graphics/mountain/mountain1.png";
const springImage = new Image(); springImage.src = "characters/spring/spring1.png";
const pendulumImage = new Image(); pendulumImage.src = "characters/pendulum/pendulum1.png";
const wandererImage = new Image();wandererImage.src = "characters/wanderer/wanderer1.png";
const blockImage = new Image();blockImage.src = "characters/block/block1.png";
const platformBlockImage = new Image();platformBlockImage.src = "characters/platformBlock/platformBlock1.png";
const bulletImage = new Image();bulletImage.src = "characters/bullet/bullet1.png"; // 適宜パスを変更
// -------------------------
// 森（オプション）
// -------------------------
const forestFiles = [
  "graphics/forest/forest1.png",
  "graphics/forest/forest2.png",
  "graphics/forest/forest3.png",
  "graphics/forest/forest4.png"
];
const forestImageObjects = forestFiles.map(src => { const img = new Image(); img.src = src; return img; });

let forestTiles = [];
const FOREST_HEIGHT = 60;
const FOREST_SPEED_FACTOR = 0.5;

// -------------------------
// Sound/BGM
// -------------------------
const bgmPlayer = new BGMPlayer("sounds/BGM/a.mp3", {volume:0.05, loop:true});
const fireworkSEPath = "sounds/Sound_Effect/firework.mp3";

// -------------------------
// UI
// -------------------------
const msgBox = document.getElementById('msg');
function showMsg(text, ms=1800){
  msgBox.textContent = text;
  msgBox.style.display='block';
  clearTimeout(showMsg._t);
  showMsg._t = setTimeout(()=> msgBox.style.display='none', ms);

// -------------------------
// 雲
// -------------------------
const clouds = [
  {x:80, y:50, scale:1, speed:0.2},
  {x:220, y:70, scale:0.8, speed:0.15},
  {x:340, y:40, scale:1.2, speed:0.25}
];

// -------------------------
// 山
// -------------------------
const numMountains = 2;
const mountains = [];
const mountainWidth = 400;
const mountainHeight = 120;
const minGap = 400;
let currentX = 0;
for (let i = 0; i < numMountains; i++) {
  mountains.push({ x: currentX, image: mountainImage });
  currentX += mountainWidth + minGap + Math.random() * 200;
}

function repositionMountain(m, index) {
  let tries = 0;
  do {
    let maxX = 0;
    mountains.forEach((other, i) => { if (i !== index) maxX = Math.max(maxX, other.x + mountainWidth); });
    m.x = maxX + minGap + Math.random() * 200;
    tries++;
  } while (mountains.some((other, i) => i !== index && Math.abs(other.x - m.x) < mountainWidth) && tries < 10);
}
function drawMountains() {
  mountains.forEach((m, index) => {
    m.x -= 0.2;
    if (m.x + mountainWidth < -200) repositionMountain(m, index);
    if (m.image.complete) ctx.drawImage(m.image, m.x, GROUND_Y - mountainHeight, mountainWidth, mountainHeight);
    else { ctx.fillStyle = "#9ACD9A"; ctx.fillRect(m.x, GROUND_Y - mountainHeight, mountainWidth, mountainHeight); }
  });
}
function drawCloud(c){
  if (cloudImage.complete && cloudImage.naturalWidth > 0) {
    const desiredHeight = 40 * c.scale;
    const aspect = cloudImage.naturalWidth / cloudImage.naturalHeight;
    const drawW = Math.round(desiredHeight * aspect);
    const drawH = Math.round(desiredHeight);
    const dx = Math.round(c.x - drawW / 2);
    const dy = Math.round(c.y - drawH / 2);
    ctx.drawImage(cloudImage, dx, dy, drawW, drawH);
  } else {
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath();
    ctx.arc(c.x, c.y, 20 * c.scale, 0, Math.PI * 2);
    ctx.arc(c.x + 15 * c.scale, c.y - 10 * c.scale, 15 * c.scale, 0, Math.PI * 2);
    ctx.arc(c.x + 30 * c.scale, c.y, 20 * c.scale, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fill();
  }
}

/* 初期化 */
function resetGameState(){
  const initialSize = 30;
  player = {
    x:120,
    y: GROUND_Y - initialSize,
    vy:0,
    size: initialSize,
    falling:false,
    onPlatform: null,
    inPit:false,
    _fallSoundPlayed: false,
    _fallStarted: false,
    // parachute
    parachute: false,
    parachuteTimer: 0
  };
  jumpStage = 0; maxJumpStage = 3; // ← 3段目でパラシュート
  obstacles = []; explosions = []; holes = [];
  fireworks = [];
  score = 0; spawnTimer = 0; holeTimer = 0;
  gameTime = 6000;
  hp = 4; invincible = 0; flash = 0;
  distance = 0; goalLine = null; gameClear = false; gameOver = false;
  worldSpeed = worldSpeedDefault;

  // mountains & clouds initial (軽量)
  if (mountains.length >= 2) { mountains[0].x = 0; mountains[1].x = W; }
  if (clouds.length >= 3){ clouds[0].x = 80; clouds[1].x = 220; clouds[2].x = 340; }

  initForest();
}

/* forest 初期化 */
function initForest(){
  forestTiles = [];
  let x = 0;
  const targetWidth = canvas.width * 1.5;
  while (x < targetWidth) {
    const img = forestImageObjects.length ? forestImageObjects[Math.floor(Math.random() * forestImageObjects.length)] : null;
    const aspect = (img && img.naturalWidth && img.naturalHeight) ? (img.naturalWidth / img.naturalHeight) : 3;
    const w = Math.round(FOREST_HEIGHT * aspect) || Math.round(FOREST_HEIGHT * 3);
    forestTiles.push({ image: img, x: x, w: w });
    x += w;
    if (forestTiles.length > 30) break;
  }
}

/* forest 更新 */
function updateForest(){
  const speed = worldSpeed * FOREST_SPEED_FACTOR;
  for (let t of forestTiles){ t.x -= speed; }
  function rightmostX(){
    let max = -99999;
    for (let t of forestTiles){
      const img = t.image;
      const aspect = (img && img.naturalWidth && img.naturalHeight) ? (img.naturalWidth / img.naturalHeight) : (t.w / Math.max(1, FOREST_HEIGHT));
      const drawW = Math.round(FOREST_HEIGHT * aspect) || t.w;
      max = Math.max(max, t.x + drawW);
    }
    return max;
  }
  for (let t of forestTiles){
    const img = t.image;
    const aspect = (img && img.naturalWidth && img.naturalHeight) ? (img.naturalWidth / img.naturalHeight) : (t.w / Math.max(1, FOREST_HEIGHT));
    const drawW = Math.round(FOREST_HEIGHT * aspect) || t.w;
    if (t.x + drawW < -50) {
      const rx = rightmostX();
      t.x = rx + 2;
    }
  }
}

/* 花火系（軽量） */
// --- 置き換え用：安全に表示される花火処理 ---
/* fireworks 配列は既に resetGameState() で初期化されている想定 */
function spawnFireworks(cx, cy, bursts = 6) {
  const colors = ["#ff5050","#ffb84d","#fff06a","#7efc8d","#8ad4ff","#d6a0ff","#ffffff","#ff69b4"];
  let created = 0;
  for (let b = 0; b < bursts; b++) {
    const particles = 24 + Math.floor(Math.random() * 48); // 24〜71
    for (let i = 0; i < particles; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2.5 + Math.random() * 6.5; // 初速（広がりを出す）
      const vx = Math.cos(angle) * speed + (Math.random() - 0.5) * 0.6;
      const vy = Math.sin(angle) * speed + (Math.random() - 0.5) * 0.6;
      fireworks.push({
        x: cx + (Math.random() - 0.5) * 10,
        y: cy + (Math.random() - 0.5) * 10,
        vx, vy,
        size: 2 + Math.random() * 2,           // 最小3pxにして見やすく
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 60 + Math.floor(Math.random() * 120),
        age: 0,
        alpha: 1
      });
      created++;
    }
  }
  // 万一の蓄積防止
  if (fireworks.length > 5000) fireworks.splice(0, fireworks.length - 5000);
  console.log(`[spawnFireworks] created ${created} particles, total fireworks=${fireworks.length}`);
}

function updateFireworks() {
  if (!fireworks || fireworks.length === 0) return;
  // 後ろから削る方式で splice 安全に
  for (let i = fireworks.length - 1; i >= 0; i--) {
    const p = fireworks[i];
    p.age++;
    // 軽い重力でゆっくり落ちる
    p.vy += 0.03;
    // ゆるい減衰
    p.vx *= 0.998;
    p.x += p.vx;
    p.y += p.vy;
    p.alpha = Math.max(0, 1 - p.age / p.life);

    // 範囲外・寿命切れは除去
    if (p.age >= p.life || p.alpha <= 0.01 ||
        p.x < -50 || p.x > canvas.width + 50 || p.y < -50 || p.y > canvas.height + 120) {
      fireworks.splice(i, 1);
    }
  }
}

function drawFireworks() {
  if (!fireworks || fireworks.length === 0) return;

  ctx.save();

  // まずは additive 合成で光る表現（見えにくければ 'source-over' に戻す）
  const prevComp = ctx.globalCompositeOperation;
  ctx.globalCompositeOperation = 'lighter';

  for (let p of fireworks) {
    // safety: 座標が NaN になっていないかチェック（デバッグ時に一度だけログ）
    // if (!drawFireworks._warned && (isNaN(p.x) || isNaN(p.y))) { console.warn("Invalid particle coords", p); drawFireworks._warned = true; }

    const size = Math.max(2, p.size);      // 最小 2px
    // メインの光る点
    ctx.globalAlpha = Math.max(0.16, p.alpha); // 完全に消える前に見えるよう最低値設定
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
    ctx.fill();

    // やや大きめの半透明の広がりをもう一枚描いて光のボケを表現
    ctx.globalAlpha = Math.max(0.06, p.alpha * 0.28);
    ctx.beginPath();
    ctx.arc(p.x, p.y, size * 2.6, 0, Math.PI * 2);
    ctx.fill();
  }

  // restore
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = prevComp;
  ctx.restore();
}

/* 入力（ジャンプ） */
const gravity = 0.6;
function doJump() {
  if (gameOver || gameClear) return;
  tryPlayBGMOnce();

  if (player.onPlatform) jumpStage = 0;

  // 1回目・2回目は通常ジャンプ（maxJumpStage-1 回）
  if (jumpStage < maxJumpStage - 1) {
    jumpStage++;
    player.vy = -15;
    player.onPlatform = null;
    player.falling = true;
    player.inPit = false;
    // パラシュートは解除（安全）
    player.parachute = false;
    player.parachuteTimer = 0;
    playJumpSound();
    return;
  }

  // 最後の（3回目）押下でパラシュートを展開（上方向に跳ね上げない）
  if (jumpStage < maxJumpStage) {
    jumpStage++;
    player.onPlatform = null;
    player.falling = true;
    player.inPit = false;
    player.parachute = true;
    player.parachuteTimer = 0;
    // 現在上向きなら急な上昇を抑える（ゆるく浮かせる）
    if (player.vy < -3) player.vy = -3;
    if (player.vy > 1.2) player.vy = 1.2; // すでに速く落ちているなら程よく抑制
    // パラシュート展開音（任意）
    try { playSoundSequence([{freq:220,type:"sine",duration:0.18}]); } catch(e){}
    return;
  }
}
document.addEventListener("keydown", e=>{ if(e.code==="Space"){ e.preventDefault(); doJump(); } if(e.code==="Enter" && (gameOver || gameClear)) restart(); });
document.getElementById("jumpBtn").addEventListener("click", doJump);
document.getElementById("restartBtn").addEventListener("click", ()=>{ tryPlayBGMOnce(true); restart(); });
canvas.addEventListener("touchstart", e=>{ e.preventDefault(); doJump(); }, {passive:false});

/* SE（簡易） */
function playSoundSequence(seq){ const audioCtx = new (window.AudioContext || window.webkitAudioContext)(); seq.forEach(({freq,type="sine",duration=0.2,delay=0,volume=0.2})=>{ const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = type; osc.frequency.value = freq; const startTime = audioCtx.currentTime + delay; gain.gain.setValueAtTime(volume,startTime); gain.gain.exponentialRampToValueAtTime(0.001,startTime+duration); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(startTime); osc.stop(startTime+duration+0.05); }); }
function playJumpSound(){ playSoundSequence([{freq:jumpStage===1?440:550,type:"triangle",duration:0.12}]); }
function playDamageSound(){ playSoundSequence([{freq:160,type:"square",duration:0.22},{freq:80,type:"square",duration:0.22,delay:0.08}]); }
function playFallSound(){ playSoundSequence([{freq:120,type:"sine",duration:1.2}]); }
function playHealSound(){ playSoundSequence([{freq:523,type:"sine",duration:0.25},{freq:784,type:"sine",duration:0.25,delay:0.18}]); }
function playEnemyDefeatSound(){ playSoundSequence([{freq:420,type:"triangle",duration:0.12},{freq:560,type:"triangle",duration:0.12,delay:0.08}]); }
function playGoalSound(){ playSoundSequence([{freq:880,type:"sine",duration:0.25},{freq:660,type:"sine",duration:0.25,delay:0.2}]); }
function playClearSound(){ playSoundSequence([{freq:1200,type:"sine",duration:0.25},{freq:900,type:"sine",duration:0.2,delay:0.18},{freq:700,type:"sine",duration:0.18,delay:0.34}]); }

/* ========================= 障害物生成（ninjya & pendulum 追加） ========================= */
function spawnObstacle(){
  const count = Math.floor(Math.random()*3)+1;
  for(let i=0;i<count;i++){
    if (obstacles.length >= MAX_OBSTACLES) break;

    const r = Math.random();
    let type;
    
    if (i === 0 && r < 0.08) type = "chaser";
    else if (i === 0 && r < 0.10) type = "chaser2"; // 0.08〜0.10
    else if (i === 0 && r < 0.11) type = "chaser3"; // 
    else if (r < 0.12) type = "wanderer"
    else if (r < 0.14) type = "ninjya";             // ← 忍者（少しだけの確率）
    else if (r < 0.16) type = "pendulum"; 
    else if (r < 0.20) type = "spring";          
    else if (r < 0.25) type = "heal";
    else if (r < 0.30) type = "platform";
    else if (r < 0.35) type = "bouncer";
    else if (r < 0.40) type = "wiggle";
    else if (r < 0.42) type = "bullet";
    else if (r < 0.45) type = "fallingPlatform"; // 落下足場
    else if (r < 0.50) type = "risingPlatform";
    else if (r < 0.55) type = "block"; // ← block を追加
    else if (r < 0.60) type = "platformBlock";
     


    
    else type = ["normal","zigzag","breakable","balloon"][Math.floor(Math.random()*4)];

    let yPos = GROUND_Y - 30, baseY;
    let width = 20, height = 20;

    switch(type){
      case "ninjya":
        width = 28; height = 28;
        yPos = 50 + Math.random()*(GROUND_Y - 100);
        obstacles.push({
          x: W + i*40,
          y: yPos,
          width, height,
          type: "ninjya",
          vx: -1.8 - Math.random()*1.2, // 左へ進む速度
          alpha: 1,
          fadeDir: -1,
          fadeSpeed: 0.018 + Math.random()*0.02,
          fadeTimer: Math.floor(Math.random()*40)+20, // 初期表示時間（フレーム）
          visibleTimerRange: [50, 100], // 出現時のランダム継続
          hiddenTimerRange: [20,50],   // 非表示時のランダム継続
          scored: false
        });
        break;

        case "pendulum":
  // ゆらゆら落下タイプ（糸なし）
  width = 28; height = 28;
  const startX = W / 2 +50 + Math.random() * 160;
  const startY = -20; // 画面上から出現
  const swingAmp = 80 + Math.random() * 30;   // 揺れ幅
  const swingSpeed = 0.01 + Math.random() * 0.01; // 揺れる速さ
  const initAngle = Math.random() * Math.PI * 2;
  obstacles.push({
    x: startX,
    y: startY,
    baseX: startX,
    width, height,
    type: "pendulum",
    vy: 0.1 + Math.random() * 0, // 落下速度
    angle: initAngle,
    swingAmp,
    swingSpeed,
    gravity: 0.01, // 少しずつ加速
    scored: false
  });
  break;
  case "bullet":
  width = 26;
  height = 26;
  yPos = 100 + Math.random() * (GROUND_Y - 150); // ある程度の高さランダム
  obstacles.push({
    x: W-30 ,        // 右端から出現
    y: yPos,
    width, height,
    type: "bullet",
    vx: 0,                // 最初は静止
    waitTimer: 120,        // 0.5秒（30フレーム）待機
    speed: -10,           // 発射速度（左へ）
    remove: false,
    img: bulletImage,     // 事前に読み込み済み
    scored: false
  });
  break;

  case "spring":
        // 地面に置くバネ（幅30、高さ10）。踏むとプレイヤーを上へ跳ね上げる
        width = 26; height = 26;
        yPos = GROUND_Y - height-30; // 地面にぴったり-30の位置に設置
        obstacles.push({
          x: W + i*30,
          y: yPos,
          width, height,
          type: "spring",
          bouncePower: -12 - Math.random()*3, // プレイヤーの上向き速度（負の値）
          cooldown: 0,   // フレーム単位のクールダウン（踏んだ後の無効時間）
          pressed: false,

  const fgWidth = 100;

    if (ob.type === "pendulum") {

  ob.angle += ob.swingSpeed;

  const swing = Math.sin(ob.angle);
  const adjustedSwing = swing >= 0 ? swing * 3.0 : swing * 0.5; // 調整倍率
  ob.x = ob.baseX + adjustedSwing * ob.swingAmp;

  // ゆっくり落下
  ob.vy += ob.gravity;

// block の処理
if (ob.type === "block") {

  ob.y = ob.baseY + Math.sin(Date.now() * speed + ob.waveOffset) * amplitude;

  if (onTop) {

    player.y = ob.y - player.size;

    player.vy = -5;

  if (ob.x + ob.width < -50) ob.remove = true;

if (ob.type === "spring") {

  }

  // プレイヤーが上から踏んでいるか判定

  const playerRight = player.x + player.size;

  const onTop =
    player.vy >= 0 &&                       // 落下中のみ
    playerBottom >= ob.y &&                 // プレイヤーがスプリングの上にいる
    playerBottom - player.vy <= ob.y &&    // 前フレームでまだ下に潜っていなかった
    playerRight > ob.x &&                   // 横方向重なり
    player.x < obRight;

  if (!ob.pressed && ob.cooldown === 0 && onTop) {

    // 効果音を入れる場合

  }

  // 横スクロール処理は後で ob.x -= speed

}


    // それ以外（normal, breakable, etc.）
    ob.x -= speed;

    if(ob.type === "zigzag" && ob.baseY !== undefined){

  ob.x += Math.sin(ob.shakeAngle) * shakeAmount;

  // 穴に落ちる判定
  for (let h of holes) {
    if (
      ob.x + ob.width > h.x &&

  }
}


if (!ob.falling && ob.type === "breakable") {

  }

  // 上下運動
  ob.y += ob.vyJump;
  ob.vyJump += 0.05; // 重力を弱めてゆっくり落ちる
  if (ob.y > ob.baseY) { // 底に戻ったら再ジャンプ
    ob.y = ob.baseY;
    ob.vyJump = -1.0; // ゆっくり再ジャンプ
  }

  // 穴に落ちる判定
  for (let h of holes) {
    if (
      ob.x + ob.width > h.x &&

    ) {

  }
}

  }

    if(!ob.falling && outOfScreen){

    }
    if(ob.falling && ob.y > canvas.height +1) return false;

  holes.forEach(h => h.x -= worldSpeed);

  for (let fg of foregrounds) {

}

/* ========================= 衝突判定（ninjyaは透明中は当たり判定なし） ========================= */
function checkCollision() {
  if (invincible > 0 || gameClear) return;

  for (let i = 0; i < obstacles.length; i++) {
    const ob = obstacles[i];
    if (ob.falling) continue;

    // ✳️ 忍者がかなり透明なら当たり判定をスキップ
    if (ob.type === "ninjya" && (ob.alpha === undefined ? 1 : ob.alpha) < 0.6) continue;

    const playerCenterX = player.x + player.size / 2;
    const playerCenterY = player.y + player.size / 2;
    const obCenterX = ob.x + ob.width / 2;
    const obCenterY = ob.y + ob.height / 2;
    const dx = playerCenterX - obCenterX;
    const dy = playerCenterY - obCenterY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    // Heal
    if (ob.type === "heal" && dist < player.size / 2 + 14) {
      explosions.push({ x: obCenterX, y: obCenterY, radius: 0, maxRadius: 60, color: "rgba(255,50,50,0.6)" });
      obstacles.splice(i, 1); i--;
      hp = 4; score += 10; flash = 8; invincible = 30;
      player.parachute = false;
      player.parachuteTimer = 0;
      playHealSound();
      continue;
    }

    // Balloon（当たったら小さく弾く）
    if (ob.type === "balloon" && dist < player.size / 2 + 16) {
      explosions.push({ x: obCenterX, y: obCenterY, radius: 0, maxRadius: 30 });
      obstacles.splice(i, 1); i--;
      score += 5; gameTime += 60;
      player.parachute = false; player.parachuteTimer = 0;
      player.vy = (playerCenterY < obCenterY) ? -6 : 4;
      invincible = 30; flash = 10;
      playEnemyDefeatSound();
      continue;
    }
// Wanderer 敵
if (ob.type === "wanderer" && dist < player.size / 2 + 16) {
  explosions.push({ x: obCenterX, y: obCenterY, radius: 0, maxRadius: 40, color: "rgba(200,0,255,0.5)" });
  obstacles.splice(i, 1); i--;
  hp--; flash = 8;
  playDamageSound();
  if (hp <= 0) gameOver = true;
  continue;
}

    // 敵（踏み/接触） -- pendulum を含める
    if (["normal", "zigzag", "breakable", "chaser", "chaser2", "wiggle","bouncer","ninjya","pendulum","bullet"].includes(ob.type) &&
        player.x < ob.x + ob.width && player.x + player.size > ob.x &&
        player.y < ob.y + ob.height && player.y + player.size > ob.y) {

      player.parachute = false;
      player.parachuteTimer = 0;

      if (ob.type === "breakable" && player.vy > 0 && player.y + player.size <= ob.y + 20) {
        explosions.push({ x: obCenterX, y: obCenterY, radius: 0, maxRadius: 30 });
        obstacles.splice(i, 1); i--;
        score += 5; gameTime += 60; player.vy = -8;
        playEnemyDefeatSound();
        continue;
      }

      if (ob.type === "chaser" || ob.type === "chaser2" || ob.type === "ninjya" || ob.type === "pendulum") {
        // pendulum に当たったらダメージ（忍者やchaser同様）
        hp--; invincible = 30; flash = 10; playDamageSound();
        if (hp <= 0) return endGame();
        explosions.push({ x: obCenterX, y: obCenterY, radius: 0, maxRadius: 25 });
        // chaser系は消える、忍者は残す。pendulumは残す（好みに応じてここで消す）
        // if (ob.type !== "ninjya" && ob.type !== "pendulum") { obstacles.splice(i, 1); i--; }
        continue;
      }
      // block（プレイヤーが上に乗れるブロック）
      if (ob.type === "block") {
  // 横スクロール
  ob.x -= worldSpeed;

  const playerBottom = player.y + player.size;
  const onTop =
    player.vy >= 0 && // 落下中のみ
    player.x + player.size > ob.x &&
    player.x < ob.x + ob.width &&
    playerBottom >= ob.y &&
    playerBottom <= ob.y + ob.height;

  if (onTop) {
    // 着地した瞬間にジャンプカウントをリセット
    if (player.onPlatform !== ob) {
      jumpStage = 0;
    }

    // プレイヤーをブロックの上に固定
    player.y = ob.y - player.size;
    player.vy = 0;
    player.onPlatform = ob;
  } else if (player.onPlatform === ob) {
    player.onPlatform = null;
  }

  // 描画 blockImage（事前に読み込んでおく）
  ctx.drawImage(blockImage, ob.x, ob.y, ob.width, ob.height);

  // 画面外で削除
  if (ob.x + ob.width < -50) ob.remove = true;

  continue; // 以降の処理はスキップ
}
if (ob.type === "platformBlock") {
  // 横スクロール
  ob.x -= worldSpeed;

  const playerBottom = player.y + player.size;
  const playerRight = player.x + player.size;
  const obRight = ob.x + ob.width;
  const tolerance = 4; // 少し余裕を持たせる

  // ブロック上に乗っているか判定（落下中のみ）
  const onTop =
    player.vy >= 0 &&
    playerBottom >= ob.y - tolerance &&
    playerBottom - player.vy <= ob.y &&
    playerRight > ob.x &&
    player.x < obRight;

  if (onTop) {
    // 着地した瞬間にジャンプカウントをリセット
    if (player.onPlatform !== ob) {
      player.jumpCount = 0;       // ジャンプ回数リセット
      player.parachute = false;
      player.parachuteTimer = 0;
      player.falling = false;
    }

    // プレイヤーをプラットフォームの上に強制固定
    player.y = ob.y - player.size;
    player.vy = 0;

    // HP回復やエフェクトを追加したい場合はここ

  } else if (player.onPlatform === ob) {
    // プラットフォームから離れた場合
    player.onPlatform = null;
    player.onGround = false;
  }

  // 描画 platformBlockImage（事前に読み込んでおく）
  ctx.drawImage(platformBlockImage, ob.x, ob.y, ob.width, ob.height);

  // 画面外で削除
  if (ob.x + ob.width < -50) ob.remove = true;

  continue; // 以降の処理はスキップ
}
    // spring（上から踏んだら跳ねる）
    if (ob.type === "spring" &&
        player.x < ob.x + ob.width && player.x + player.size > ob.x) {
      // 上から踏む条件：プレイヤーが落下中（vy>0）かつ足がバネの上端付近にある
      if (player.vy > 0 && (player.y + player.size) <= (ob.y + 18)) {
        if (!ob.cooldown || ob.cooldown <= 0) {
          // 跳ね上げ
          player.vy = ob.bouncePower || -13;
          // プレイヤーをバネの上にぴったり合わせる（安定させる）
          player.y = ob.y - player.size;

          ob.cooldown = 20;   // 20フレーム（約0.33秒） 無効化（必要なら調整）
          ob.pressed = true;
          // エフェクト・得点・音
          explosions.push({ x: ob.x + ob.width/2, y: ob.y + ob.height/2, radius: 0, maxRadius: 20 });

          invincible = 0; // 任意：無敵付与しない

          if (typeof playEnemyDefeatSound === "function") playEnemyDefeatSound();
        }
        continue; // 次の障害物へ
      }
    }

      if (ob.type === "bouncer") {
        hp--; invincible = 30; flash = 10; playDamageSound();
        if (hp <= 0) return endGame();
        explosions.push({ x: obCenterX, y: obCenterY, radius: 0, maxRadius: 20 });
        continue;
      }

      hp--; invincible = 30; flash = 10; playDamageSound();
      if (hp <= 0) return endGame();
    }
  }

  // 足元の穴（少しでも落ちたら即ゲームオーバー）
  const footY = player.y + player.size;
  if (footY >= GROUND_Y - 1) {

      if ((playerLeft < holeRight) && (playerRight > holeLeft)) {

        if (player.y > GROUND_Y) {
          return endGame();
        }
        // そうでない場合も「落下開始」状態に
        player.falling = true;
        player.inPit = true;
        player.vy = 2;
        return;
      }
    }
  }
}

        ob.type === "chaser2"   ? "darkblue" :
        ob.type === "chaser3"   ? "darkblue" :
        ob.type === "wiggle"    ? "cyan" :
        ob.type === "bouncer"   ? "brown" :
        ob.type === "ninjya"    ? "gray" :
        ob.type === "pendulum"  ? "purple" :
        ob.type === "wanderer"  ? "purple" :
        ob.type === "spring"    ? "purple" : 
        ob.type === "block"    ? "purple" :
        ob.type === "platformBlock"    ? "purple":
        ob.type === "bullet"    ? "purple" :"gray";

      ctx.beginPath();
      ctx.arc(ob.x + ob.width / 2, ob.y + ob.height / 2, Math.min(ob.width, ob.height) / 2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  });



  // 爆発
  explosions.forEach(e => { ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2); ctx.fillStyle = e.color || "rgba(255,165,0,0.5)"; ctx.fill(); });

  // フラッシュ
  if(flash>0){ ctx.fillStyle="rgba(255,255,255,0.5)"; ctx.fillRect(0,0,canvas.width,canvas.height); flash--; }

  // プレイヤー（パラシュートがあれば簡易表示）
  if(playerImage.complete && playerImage.naturalWidth !== 0){
    ctx.drawImage(playerImage, player.x, player.y, player.size, player.size);
  } else {
    ctx.fillStyle = "pink";
    ctx.beginPath(); ctx.arc(player.x + player.size/2, player.y + player.size/2, player.size/2, 0, Math.PI*2); ctx.fill();
  }

  // 簡易パラシュート描画（テスト用）
  if (player.parachute) {
    ctx.globalAlpha = 0.95;
    ctx.beginPath();
    ctx.ellipse(player.x + player.size/2, player.y - 6, player.size * 0.9, 10, 0, Math.PI, 2*Math.PI);
    ctx.fillStyle = "rgba(255,200,220,0.95)";
    ctx.fill();
    ctx.globalAlpha = 1;
  }
    // goal
    if(goalLine){
    if(goalImage.complete && goalImage.naturalWidth){
      const gx = goalLine.x;
      const gy = GROUND_Y - goalLine.height;
      const scale = 2.0;
      ctx.drawImage(goalImage, gx, gy - (goalLine.height * (scale - 1)), goalLine.width * scale, goalLine.height * scale);
      ctx.fillStyle = "red"; ctx.font = "bold 24px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("GOAL", gx + goalLine.width / 2, gy - 6);
    } else {
      ctx.fillStyle = "gold";
      const gy = 220;
      ctx.fillRect(goalLine.x, gy, goalLine.width, 50);
      ctx.fillStyle = "black";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("GOAL", goalLine.x + goalLine.width/2, gy - 5);
    }
  }
// ---------------------
// 前景の描画
// ---------------------
for (let fg of foregrounds) {
  if (fg.image.complete && fg.image.naturalWidth) {
    ctx.drawImage(fg.image, fg.x, GROUND_Y - fg.height, fg.width, fg.height);
  } else {
    ctx.fillStyle = "green";
    ctx.fillRect(fg.x, GROUND_Y - fg.height, fg.width, fg.height);
  }
}


  // UI
  const hpWidth = 25, hpHeight = 18;
  ctx.fillStyle="gray"; ctx.fillRect(10,10,hpWidth*4,hpHeight);
  ctx.fillStyle="lime"; ctx.fillRect(10,10,hpWidth*Math.max(0,hp),hpHeight);
  ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(canvas.width-220,10,210,24);
  ctx.fillStyle="white"; ctx.font="14px sans-serif"; ctx.textAlign="right";
  ctx.fillText(`スコア:${score}  距離:${Math.floor(distance)}  秒:${Math.floor(gameTime/60)}`, canvas.width-12, 28);



  drawFireworks();

  if(gameOver){
    ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(0,80,canvas.width,80);
    ctx.fillStyle="red"; ctx.textAlign="center"; ctx.font="bold 30px sans-serif"; ctx.fillText("Game Over!", canvas.width/2, 105);
    ctx.fillStyle="white"; ctx.font="14px sans-serif"; ctx.fillText("リスタートボタンで再挑戦", canvas.width/2, 130);
  }
  if(gameClear){
    ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(0,80,canvas.width,80);
    ctx.fillStyle="lime"; ctx.textAlign="center"; ctx.font="bold 30px sans-serif"; ctx.fillText("Game Clear!", canvas.width/2, 105);
    ctx.fillStyle="white"; ctx.font="14px sans-serif"; ctx.fillText("リスタートボタンで再挑戦", canvas.width/2, 130);
  }
}

/* ========================= メインループ ========================= */
function loop(){
  // ゲームオーバー時だけループ停止（クリア時はループを継続して花火を描画する）
  if (gameOver) {
    loopStarted = false;
    return;
  }

  // -------------------------
  // 距離と背景更新（ゲームクリア時はワールドをゆっくり停止させる演出）
  // -------------------------
  if (!gameClear) {
    distance += worldSpeed;
    mountains.forEach(m => {
      m.x -= 0.5;
      if (m.x <= -W) m.x += 2*W;
      if (m.x >= 2*W) m.x -= 2*W;
    });
    clouds.forEach(c => {
      c.x -= c.speed;
      if (c.x < -60) c.x = canvas.width + 60;
    });
    updateForest();
  } else {
    // クリア時は世界速度を徐々に落とす（任意の演出）
    worldSpeed = Math.max(0, worldSpeed - 0.02);
    mountains.forEach(m => { m.x -= 0.5 * (worldSpeed > 0 ? 1 : 0); });
    clouds.forEach(c => { c.x -= c.speed * (worldSpeed > 0 ? 1 : 0); });
    // forest は動かないようにする（updateForest を呼ばない）
  }
  if (Math.random() < 0.01) spawnForeground();
  // -------------------------
  // ゴール判定（ゴール通過時の処理は一度だけ行う）
  // -------------------------
  if (!goalLine && distance >= goalDistance * 5.0) {
  const defaultW = 80, defaultH = 80;
  let gw = defaultW, gh = defaultH;

  if (goalImage.complete && goalImage.naturalWidth) {
    const scale = Math.min(1, 120 / goalImage.naturalWidth);
    gw = Math.round(goalImage.naturalWidth * scale);
    gh = Math.round(goalImage.naturalHeight * scale);
  }

  goalLine = { x: canvas.width + 100, width: gw, height: gh };
  playGoalSound();
  showMsg("ゴールライン出現！", 2000);
}

  if (goalLine && !gameClear) {
    goalLine.x -= worldSpeed;
    if (player.x + player.size > goalLine.x) {
      // ゴール到達：ゲームを「クリア」状態にするがループは止めない
      gameClear = true;
      // ループ停止はしない（ここを削除／変更したのが肝）
      bgmPlayer.fadeOut(0.02, 120);
      playClearSound();

      // 花火連発（setInterval で spawnFireworks を呼ぶ）
      let cnt = 0;
      const t = setInterval(() => {
        spawnFireworks(canvas.width/2 + (Math.random()-0.5)*120, 120 + Math.random()*40, 6);
        try { new Audio(fireworkSEPath).play(); } catch(e){}
        if (++cnt >= 6) clearInterval(t);
      }, 400);

      showMsg("クリア！ 花火！", 3000);
    }
  } else if (goalLine) {
    // goalLine が既に出ていて gameClear==true の場合も、goalLine を少し移動させておく（演出）
    goalLine.x -= worldSpeed;
  }

  // -------------------------
  // ゲーム処理：クリア時は敵やプレイヤーの挙動を止める（必要なら完全停止に）
  // -------------------------
  if (!gameClear) {
    // 通常プレイ時の更新
    gameTime--;
    if (gameTime <= 0) endGame();

    updateObstacles();
    updateForegrounds();
    obstacles = obstacles.filter(ob => !ob.remove);

    // プレイヤー物理（そのまま）
    const prevY = player.y;
    const prevFootY = prevY + player.size;

    if (player.onPlatform) {
      const p = player.onPlatform;
      const stillExists = obstacles.includes(p) && p.type === "platform";
      const overlapX = stillExists && (player.x + player.size > p.x) && (player.x < p.x + p.width);
      if (!stillExists || !overlapX) {
        player.onPlatform = null;
        player.falling = true;
        player.inPit = false;
        player.parachute = false;
        player.parachuteTimer = 0;
        player.vy = Math.max(player.vy, 2);
      } else {
        player.y = p.y - player.size;
        player.vy = 0;
        player.falling = false;
        player.parachute = false;
        player.parachuteTimer = 0;
      }
    }

    if (!player.onPlatform) {
      if (player.parachute) {
        player.vy += 0.08;
        if (player.vy > 1.5) player.vy = 1.5;
        player.parachuteTimer = (player.parachuteTimer || 0) + 1;
        if (player.parachuteTimer > 360) {
          player.parachute = false;
          player.parachuteTimer = 0;
        }
      } else {
        player.vy += player.falling ? 0.9 : 0.5;
      }
      player.y += player.vy;
    }

    const newFootY = player.y + player.size;
// -----------------
// risingPlatform用
// -----------------
for (let ob of obstacles) {
  if (ob.type !== "risingPlatform") continue;

  const playerBottom = player.y + player.size;
  const horizontalOverlap = player.x + player.size > ob.x && player.x < ob.x + ob.width;
  const crossingTop = playerBottom <= ob.y && playerBottom + player.vy >= ob.y;

  if (horizontalOverlap && crossingTop) {
    // 乗った瞬間
    player.y = ob.y - player.size;
    player.vy = 0;
    player.onPlatform = ob;

    player.falling = false;
    jumpStage = 0; // ←ここでジャンプカウントリセット

    if (!ob.triggered) {
      ob.triggered = true;
      ob.riseTimer = 0;
    }
  }

  // 上昇処理
  if (ob.triggered) {
    ob.riseTimer++;
    if (ob.riseTimer > ob.riseDelay) {
      ob.vy = -1.2;
      ob.y += ob.vy;
      if (player.onPlatform === ob) player.y += ob.vy;
    }
  }

  // 画面外削除
  if (ob.y + ob.height < -50) {
    ob.remove = true;
    if (player.onPlatform === ob) player.onPlatform = null;
  }
}

    // プラットフォーム着地判定
    let landingY = Infinity, landingPlatform = null;
    for (let ob of obstacles) {
      if (ob.type !== "platform" && ob.type !== "fallingPlatform") continue;
      const overlapX = (player.x + player.size > ob.x) && (player.x < ob.x + ob.width);
      if (!overlapX) continue;
      const topY = ob.y;
      if (topY >= prevFootY - 0.5 && topY <= newFootY + 0.5) {
        if (topY < landingY) { landingY = topY; landingPlatform = ob; }
      }
    }

    if (landingPlatform) {
      player.y = landingPlatform.y - player.size;
      player.vy = 0;
      player.falling = false;
      player.onPlatform = landingPlatform;
      player.inPit = false;
      player.parachute = false;
      player.parachuteTimer = 0;
      jumpStage = 0;
      if (landingPlatform.type === "fallingPlatform" && !landingPlatform.triggered) {
        landingPlatform.triggered = true;
        landingPlatform.fallTimer = 0;
      }
    } else {
      if (newFootY >= GROUND_Y) {
        const footXCenter = player.x + player.size/2;
        const overPit = holes.some(h => footXCenter > h.x + 4 && footXCenter < h.x + h.width - 4);
        if (overPit) {
          player.inPit = true;
          player.falling = true;
        } else {
          player.inPit = false;
          player.falling = false;
          player.vy = 0;
          player.y = GROUND_Y - player.size;
          player.onPlatform = null;
          jumpStage = 0;
          player.parachute = false;
          player.parachuteTimer = 0;
        }
      }
    }

    if (!player._fallStarted && player.inPit && player.y > GROUND_Y + 1) player._fallStarted = true;
    if (player._fallStarted && !player._fallSoundPlayed) { player._fallSoundPlayed = true; try{ playFallSound(); } catch(e){} }
    if (player.y > canvas.height + 50 && player._fallStarted) endGame();

    // spawn
    spawnTimer++;
    if (spawnTimer > SPAWN_INTERVAL) {
      if (obstacles.length < MAX_OBSTACLES - 6) spawnObstacle();
      spawnTimer = 0;
    }
    spawnHoleIfReady();

    if (invincible > 0) invincible--;
    checkCollision();
    updateExplosions();
  } else {
    // gameClear == true のときは、通常のゲーム処理（敵生成や当たり判定）はスキップして
    // 花火の更新・描画だけを行う。必要ならここで演出（BGMフェード等）を追加。
  }

  // -------------------------
  // 花火は常に更新（ゲームクリア後も描画を継続）
  // -------------------------
  updateFireworks();

  // -------------------------
  // 描画（draw() の中で drawFireworks() を呼んでいる想定）
  // -------------------------
  draw();

  // ループ継続
  requestAnimationFrame(loop);
}



/* ========================= Game Over / Restart ========================= */
function endGame(){
  gameOver = true;
  loopStarted = false; // 重要：ループが止まったことをフラグに記録
  showMsg("ゲームオーバー", 2000);
  try { bgmPlayer.stop(); } catch(e){ }
}

function restart(){
  resetGameState();
  _bgmPlayAttempted = false;
  showMsg("ゲームを開始しました", 1200);
  tryPlayBGMOnce(true);

  // ループが停止している（＝以前 gameOver/gameClear で止まった）なら再開
  if(!loopStarted){
    loopStarted = true;
    requestAnimationFrame(loop);
  }
}

/* BGM トリガ */
let _bgmPlayAttempted = false;
function tryPlayBGMOnce(force=false){
  if(_bgmPlayAttempted && !force) return;
  _bgmPlayAttempted = true;
  bgmPlayer.play().then(()=> { showMsg("BGM再生中",1000); }).catch(err => { console.log("BGM再生できませんでした:", err); showMsg("ブラウザがBGM再生をブロックしました。操作で再生してください。", 2500); });
}

/* 初期化 & 起動 */
resetGameState();
if(!loopStarted){ loopStarted = true; requestAnimationFrame(loop); }

window._game = { restart, tryPlayBGMOnce, bgmPlayer, setPlayerSize: (s)=>{ player.size = s; player.y = GROUND_Y - s; } };

</script>
